# The emulator's AVB: SmartXbar plays to the amplifier through "avb:<NAME>"
# devices (plug:avb:MGU_GW_2_SINK_CF_48_STEREO, ...), which the unit's AVB
# stream handler serves; that is masked here, so SmartXbar's routing zones
# toward the amplifier never ran ("Acknowledge connection ... failed").
#
# Here each avb device is a loopback substream of its own (CONFIG_SND_ALOOP,
# timer-paced like the real clock; four cards from snd_aloop.enable=1,1,1,1 in
# run.ps1, eight substreams a direction each; card 0 is left to the unit's
# asound.conf, whose HFP devices are on card 0 as on the car) through ALSA's file plugin,
# which keeps what SmartXbar sends the device in /run/avbcap/<NAME>.wav.
# emu-audio.sh points the names it doesn't record at /dev/null first (about
# 2 MB/s in RAM otherwise). Sinks play on cards 1 and 2, sources capture on
# card 3, whose other ends nobody plays (silence). SmartXbar asks for exact
# buffer sizes, so no dmix in between. Generated: the names are
# SmartXMGU.bin's plug:avb: devices. Overrides 50-smartx.conf's
# "pcm.avb = pcm.smartx".
pcm.!avb {
	@args [ NAME ]
	@args.NAME {
		type string
	}
	type file
	slave.pcm {
		@func refer
		name {
			@func concat
			strings [ "pcm.emu_avb_" $NAME ]
		}
	}
	file {
		@func concat
		strings [ "/run/avbcap/" $NAME ".wav" ]
	}
	format "wav"
	perm 0666
}

pcm.emu_avb_MGU_GW_1_SINK_CF_24_MONO "hw:1,0,0"
