# mgu-emu: the whole journal also goes to the VM's virtio console (hvc0), which
# run.ps1 writes to journal.log on the host (readable after a crash). Not a
# serial port: at its ~25 KB/s the HMI blocked on logging and missed its
# watchdog (README, "Logs").
[Journal]
ForwardToConsole=yes
TTYPath=/dev/hvc0
MaxLevelConsole=debug
RateLimitIntervalSec=0
