# mgu-emu: MainApp finishes initializing only once the HMI is up; on llvmpipe
# the HMI takes minutes, and oapcontroller counts a MainApp that does not
# initialize in time as a crash (the third one wipes every app). Start the
# app platform once the HMI reports ready (hmi.service is Type=notify).
[Unit]
After=hmi.service
