# mgu-emu: the centre screen is the VM's virtio-gpu output (Virtual-1, its
# preferred mode set to 1920x720 by run.ps1) instead of HDMI-A-1. Mesa picks
# kms_swrast (llvmpipe) for it: there is no virtio_gpu_dri.so in the image.
# eglfix (eglfix/eglfix.c) makes Winston's first EGL config match its GBM
# surface, which i965 does by itself and llvmpipe does not.
[Service]
ExecStart=
ExecStart=/usr/bin/winston --param output[Virtual-1]=0,0,1920,720 --param output-model[Virtual-1]=center --param null-output[Virtual-2]=0,1080,360,208,60 --param output-model[Virtual-2]=ic1 --param null-output[Virtual-3]=500,1080,360,208,60 --param output-model[Virtual-3]=ic2 --param null-output[Virtual-4]=0,2000,360,208,60 --param output-model[Virtual-4]=hud1 --param null-output[Virtual-5]=500,2000,360,208,60 --param output-model[Virtual-5]=hud2 --param input=/dev/input/tap2touch
Environment=EGL_LOG_LEVEL=info
WatchdogSec=60
Environment=LD_PRELOAD=/usr/lib/mgu-emu/eglfix.so
