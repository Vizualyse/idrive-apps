# mgu-emu: on the car this mounts /var/opt/public over /var/opt/.public with
# eCryptfs, its key wrapped by the keystore in /var/opt/.public.edeka. The
# emulator has no eCryptfs: the tool would empty /var/opt/public at every boot
# (a new key, nothing mounted), so every app and its data would be gone at the
# next start. Here public stays a plain folder (emu-var-opt.service fills it).
[Service]
ExecStart=
ExecStart=/bin/true
