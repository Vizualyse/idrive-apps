# mgu-emu: the HMI's own log (libdlt) also to stdout, so to the journal and
# journal.log on the host; the DLT daemon here has no TCP port to read from.
# On llvmpipe, with the app platform up too, the HMI takes more than the
# unit's 60 s to report ready; and a stalled VM (Windows holding QEMU) can
# miss its 30 s watchdog. On the car recmgr would restart the unit: here the
# HMI restarts on its own.
[Service]
Environment=DLT_LOCAL_PRINT_MODE=FORCE_ON
TimeoutStartSec=300
Restart=on-failure
RestartSec=5
