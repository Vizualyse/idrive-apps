<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="g20i2">
<meta name="theme-title" content="G20 inspired 2">
<meta name="theme-family" content="g20i2">
<meta name="theme-mode" content="sport">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="40">

<!-- shared values: smoothed readings, the scales' stop maps (the mockup's
     stopsMap as sums of clamped pieces), the shift cue and its flash -->
<meta name="let:vMph" content="smooth(mph(kmh), 12)">
<meta name="let:vRpm" content="smooth(rpm, 18)">
<meta name="let:kRpm" content="vRpm / 1000">
<meta name="let:eng" content="smooth(engineHp, 10)">
<meta name="let:ele" content="smooth(elecHp, 10)">
<meta name="let:fSpd" content="clamp(vMph / 20) * 0.17 + clamp((vMph - 20) / 20) * 0.13 + clamp((vMph - 40) / 20) * 0.12 + clamp((vMph - 60) / 20) * 0.12 + clamp((vMph - 80) / 20) * 0.12 + clamp((vMph - 100) / 20) * 0.12 + clamp((vMph - 120) / 40) * 0.22">
<meta name="let:fRpm" content="clamp(kRpm) * 0.17 + clamp(kRpm - 1) * 0.14 + clamp(kRpm - 2) * 0.13 + clamp(kRpm - 3) * 0.13 + clamp(kRpm - 4) * 0.14 + clamp(kRpm - 5) * 0.145 + clamp(kRpm - 6) * 0.145">
<meta name="let:cue" content="rpm >= P.shiftCue">
<meta name="let:fl" content="flash(2.5, cue)">
<meta name="let:lit" content="clamp(floor((rpm - P.lampFrom) / ((P.lampTo - P.lampFrom) / 10) + 0.5), 0, 10)">
<script type="application/json" id="theme-params">
{ "scaleLen": 1262.36, "shiftCue": 6250, "lampFrom": 4600, "lampTo": 6250,
  "engMaxHp": 400, "eleMinHp": -80, "eleMaxHp": 120, "tyreHotC": 95, "tyreColdC": 40 }
</script>

<style>
@font-face { font-family: "Cluster"; font-weight: 400; src: url(../fonts/BarlowSemiCondensed-400.woff2) format("woff2"); }

  --edrive: #3aa2ff; --regen: #9fd2ff; --cold: #4a8fd8; --wake: #ff4d12; --chev-dim: #5a1a10;
}

/* the red haze under the frames: it now reaches into the old strip, fading out by y 712 */

  -webkit-mask-image: linear-gradient(#000 640px, transparent 712px); mask-image: linear-gradient(#000 640px, transparent 712px);
  background: radial-gradient(520px 260px at 470px 595px, rgba(150,18,4,.22), transparent 70%),
              radial-gradient(520px 260px at 1450px 595px, rgba(150,18,4,.22), transparent 70%); }

  <rect x="1012" y="275" width="16" height="46" rx="4" fill="var(--sport)" data-rect="tyreHot1" data-show="tyres[1].c > P.tyreHotC" data-rate="10"/>
  <rect x="892" y="421" width="16" height="46" rx="4" fill="var(--sport)" data-rect="tyreHot2" data-show="tyres[2].c > P.tyreHotC" data-rate="10"/>

  <!-- readouts -->

<script>
(function () {
'use strict';
const W = 1920, NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, parent, text) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  if (parent) parent.appendChild(n);
  return n;
};
const lerp = (a, b, t) => a + (b - a) * t;
const RAD = Math.PI / 180;
const f1 = (v) => (Math.round(v * 100) / 100).toString();

/* ---------- the mockup's frame geometry: straight runs, corners as Q about the vertex ---------- */
function frame(points, radii, step) {
  step = step || 2;
  const prims = []; let cur = points[0];
  for (let i = 1; i < points.length; i++) {
    const p = points[i];
    if (i < points.length - 1 && radii[i] > 0) {
      const a = points[i - 1], b = points[i + 1];
      const li = Math.hypot(p.x - a.x, p.y - a.y), lo = Math.hypot(b.x - p.x, b.y - p.y);
      const di = { x: (p.x - a.x) / li, y: (p.y - a.y) / li }, dout = { x: (b.x - p.x) / lo, y: (b.y - p.y) / lo };
      const c = Math.min(radii[i], li / 2, lo / 2);
      const p1 = { x: p.x - di.x * c, y: p.y - di.y * c }, p2 = { x: p.x + dout.x * c, y: p.y + dout.y * c };
      prims.push({ q: 0, a: cur, b: p1 }, { q: 1, a: p1, c: p, b: p2 }); cur = p2;
    } else { prims.push({ q: 0, a: cur, b: p }); cur = p; }
  }
  const pts = [];
  const push = (x, y) => { const l = pts[pts.length - 1]; if (!l || Math.hypot(l.x - x, l.y - y) > 0.01) pts.push({ x, y }); };
  for (const pr of prims) {
    if (!pr.q) {
      const n = Math.max(1, Math.ceil(Math.hypot(pr.b.x - pr.a.x, pr.b.y - pr.a.y) / step));
      for (let i = 0; i <= n; i++) push(lerp(pr.a.x, pr.b.x, i / n), lerp(pr.a.y, pr.b.y, i / n));
    } else {
      for (let i = 0; i <= 40; i++) {
        const t = i / 40, u = 1 - t;
        push(u * u * pr.a.x + 2 * u * t * pr.c.x + t * t * pr.b.x, u * u * pr.a.y + 2 * u * t * pr.c.y + t * t * pr.b.y);
      }
    }
  }
  let s = 0;
  pts.forEach((p, i) => { if (i) s += Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y); p.s = s; });
  pts.forEach((p, i) => {
    const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)];
    const l = Math.hypot(b.x - a.x, b.y - a.y) || 1, tx = (b.x - a.x) / l, ty = (b.y - a.y) / l;
    p.nx = -ty; p.ny = tx;
  });
  return { pts, len: s, prims };
}
const mirror = (f) => ({ len: f.len, prims: f.prims.map((pr) => {
  const m = (p) => ({ x: W - p.x, y: p.y });
  return pr.q ? { q: 1, a: m(pr.a), c: m(pr.c), b: m(pr.b) } : { q: 0, a: m(pr.a), b: m(pr.b) };
}), pts: f.pts.map((p) => ({ x: W - p.x, y: p.y, s: p.s, nx: -p.nx, ny: p.ny })) });
function at(f, s) {
  const P = f.pts; s = Math.max(0, Math.min(f.len, s));
  let lo = 0, hi = P.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m].s < s) lo = m; else hi = m; }
  const a = P[lo], b = P[hi], t = (s - a.s) / ((b.s - a.s) || 1);
  const nx = lerp(a.nx, b.nx, t), ny = lerp(a.ny, b.ny, t), nl = Math.hypot(nx, ny) || 1;
  return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), nx: nx / nl, ny: ny / nl };
}
const off = (f, s, d) => { const p = at(f, s); return [p.x + p.nx * d, p.y + p.ny * d]; };
function pathD(f, s0, s1, d, step) {
  step = step || 3;
  let out = '';
  for (let s = s0; s <= s1 + 0.001; s += step) {
    const q = off(f, Math.min(s, s1), d);
    out += (out ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
  }
  return out;
}
/* the exact outline as M / L / Q */
function primsD(f) {
  let d = 'M' + f1(f.prims[0].a.x) + ' ' + f1(f.prims[0].a.y);
  f.prims.forEach((pr) => { d += pr.q ? ' Q' + f1(pr.c.x) + ' ' + f1(pr.c.y) + ' ' + f1(pr.b.x) + ' ' + f1(pr.b.y) : ' L' + f1(pr.b.x) + ' ' + f1(pr.b.y); });
  return d;
}

/* 70 px taller than the mockup's (572 -> 642 at the bottom), the same top, corners and angles */
const LEFT = frame([{ x: 812, y: 642 }, { x: 368, y: 642 }, { x: 198, y: 520 }, { x: 198, y: 306 }, { x: 396, y: 130 }, { x: 778, y: 84 }],
  [0, 70, 56, 56, 90, 0]);
const RIGHT = mirror(LEFT);
$('speedPath').setAttribute('d', primsD(LEFT));
$('tachPath').setAttribute('d', primsD(RIGHT));

function stopsMap(stops) {
  return (v) => {
    for (let i = 1; i < stops.length; i++) if (v <= stops[i][0]) {
      const a = stops[i - 1], b = stops[i];
      return lerp(a[1], b[1], (v - a[0]) / (b[0] - a[0]));
    }
    return stops[stops.length - 1][1];
  };
}
const SPD = { f: LEFT, s0: 212, s1: LEFT.len - 18, map: stopsMap([[0, 0], [20, .17], [40, .3], [60, .42], [80, .54], [100, .66], [120, .78], [160, 1]]) };
const TAC = { f: RIGHT, s0: 212, s1: RIGHT.len - 18, map: stopsMap([[0, 0], [1, .17], [2, .31], [3, .44], [4, .57], [5, .71], [6, .855], [7, 1]]) };
const sOf = (g, v) => lerp(g.s0, g.s1, g.map(v));
const S = $('static');

/* the deep red inner track over the scale's length; the tach's red zone on the frame */
for (const g of [SPD, TAC]) el('path', { d: pathD(g.f, g.s0, g.s1, 15, 2), fill: 'none', stroke: 'var(--sport-deep)', 'stroke-width': 2, opacity: .95 }, S);
{
  const a = sOf(TAC, 6.5), b = sOf(TAC, 7);
  let d = '';
  for (let s = a; s <= b; s += 2) { const q = off(RIGHT, s, 1.5); d += (d ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
  for (let s = b; s >= a; s -= 2) { const q = off(RIGHT, s, 11); d += 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
  el('path', { d: d + 'Z', fill: 'var(--sport)' }, S);
}
function tick(g, v, d0, d1, w, col) {
  const s = sOf(g, v), a = off(g.f, s, d0), b = off(g.f, s, d1);
  el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: col, 'stroke-width': w }, S);
}
for (let v = 0; v <= 160; v += 10) {
  const major = [0, 20, 40, 60, 80, 100, 120, 160].indexOf(v) >= 0;
  tick(SPD, v, 15, major ? 33 : 24, major ? 3 : 1.6, major ? 'var(--ink)' : 'var(--ink-3)');
}
for (let v = 0; v <= 7; v += .5) {
  const major = v % 1 === 0;
  tick(TAC, v, 15, major ? 33 : 24, major ? 3 : 1.6, v >= 6.5 ? 'var(--sport)' : major ? 'var(--ink)' : 'var(--ink-3)');
}
function label(g, v, txt, d, cls) {
  const q = off(g.f, sOf(g, v), d);

}

{
  const q = off(LEFT, sOf(SPD, 0), 58);

/* ---------- shift lamps: 10 equal lengths of the line 19 px outside the tach's
 * frame, 6 px gaps (as the lamps layers cut them), then the path on to the chevron ---------- */
{
  const sa = sOf(TAC, 4.6), sb = sOf(TAC, 6.25), n = 10;
  const P = [];
  for (let s = sa; ; s += 3) { P.push(off(RIGHT, Math.min(s, sb), -19)); if (s >= sb) break; }
  const cum = [0];
  for (let i = 1; i < P.length; i++) cum.push(cum[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const lampLen = cum[cum.length - 1], cell = lampLen / n;
  const ptAt = (l) => {
    let i = 1; while (i < P.length - 1 && cum[i] < l) i++;
    const k = (l - cum[i - 1]) / ((cum[i] - cum[i - 1]) || 1);
    return [lerp(P[i - 1][0], P[i][0], k), lerp(P[i - 1][1], P[i][1], k)];
  };
  for (let i = 0; i < n; i++) {
    let d = '';
    for (let l = i * cell + 3; ; l += 2) {
      const q = ptAt(Math.min(l, (i + 1) * cell - 3));
      d += (d ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1);
      if (l >= (i + 1) * cell - 3) break;
    }
    el('path', { d, fill: 'none', stroke: '#2e2622', 'stroke-width': 13 }, S);
    el('path', { d, fill: 'none', stroke: '#1c1512', 'stroke-width': 11 }, S);
  }
  /* the marked path: the lamp line, 10 px on, away to the chevron, arriving along its left stroke */
  const ext = off(RIGHT, sb + 10, -19);
  const CHEV = [[1426, 249], [1450, 231], [1474, 249]];
  let d = 'M' + P.map((q) => f1(q[0]) + ' ' + f1(q[1])).join(' L');
  d += ' L' + f1(ext[0]) + ' ' + f1(ext[1]) + ' L1402 267 L' + CHEV.map((q) => q.join(' ')).join(' L');
  ['lampsPath', 'lampsPathB', 'chevPath'].forEach((id) => $(id).setAttribute('d', d));
  const total = $('lampsPath').getTotalLength();
  const tail = total - lampLen;
  const chevStart = total - 2 * Math.hypot(24, 18);
  $('lampsPath').setAttribute('data-end', tail.toFixed(2));
  $('lampsPath').setAttribute('data-glow', '9 ' + lampLen.toFixed(0) + ' 1');
  $('lampsPathB').setAttribute('data-end', tail.toFixed(2));
  $('chevPath').setAttribute('data-start', chevStart.toFixed(2));
  /* the chevron, unlit */
  el('path', { d: 'M1426 249l24-18 24 18', fill: 'none', stroke: '#2a2420', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, S);
}

/* ---------- fuel (far left) and oil temperature (far right), 35 px lower ---------- */
function sideArc(cx, cy, R) {
  const pt = (a, r) => [cx + Math.cos(a) * (r == null ? R : r), cy + Math.sin(a) * (r == null ? R : r)];
  const d = (from, to, r) => {
    let o = '';
    for (let i = 0; i <= 40; i++) { const q = pt(lerp(from, to, i / 40), r); o += (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
    return o;
  };
  return { pt, d };
}
const ARC_Y = 467;
const FUEL = sideArc(332, ARC_Y, 222), FA0 = 161 * RAD, FA1 = 199 * RAD;
el('path', { d: FUEL.d(FA0, FA1), fill: 'none', stroke: 'var(--ink-4)', 'stroke-width': 7 }, S);

});

const PUMP = 'M0 0h11a2 2 0 0 1 2 2v18H-2V2a2 2 0 0 1 2-2zM1 3v6h9V3zM13 7l4 3v8a1.6 1.6 0 0 0 3.2 0V8l-3-4';

[[0, '50'], [.5, '100'], [1, '150']].forEach((k) => {

});
el('text', { x: W - 104, y: 601, 'text-anchor': 'middle', class: 'cap' }, S, 'OIL');

/* ---------- left interior: speed unit, rule, HV battery ---------- */
el('text', { x: 634, y: 331, class: 'unit', style: 'font-size:22px' }, S, 'mph');

{

/* ---------- right interior: the power bars, 30 degrees each (the mockup's 26), about (682, 415) ---------- */
{
  const CX = 682, CY = 415, A = 15, TAIL = 3;
  const bar = (R, w) => {
    const pt = (a, r) => [CX + Math.cos(a * RAD) * r, CY + Math.sin(a * RAD) * r];
    const band = () => {
      let o = '';
      for (let i = 0; i <= 30; i++) { const q = pt(lerp(A, -A, i / 30), R); o += (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
      for (let i = 30; i >= 0; i--) { const q = pt(lerp(A, -A, i / 30), R - w); o += 'L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
      return o + 'Z';
    };
    return { pt, band, R, w };
  };
  const ENG = bar(532, 22), ELE = bar(610, 22);
  for (const b of [ENG, ELE]) el('path', { d: b.band(), fill: '#0d0d0d', stroke: 'var(--ink-3)', 'stroke-width': 1.5 }, S);
  const ZERO = 80 / 200;   /* electric: -80 .. +120 hp */
  {
    const a = lerp(A, -A, ZERO), p0 = ELE.pt(a, ELE.R + 6), p1 = ELE.pt(a, ELE.R - ELE.w - 6);
    el('line', { x1: p0[0], y1: p0[1], x2: p1[0], y2: p1[1], stroke: 'var(--ink)', 'stroke-width': 2 }, S);
  }
  const labels = (b, top, name, valId) => {
    const t = b.pt(-A, b.R - b.w / 2), bt = b.pt(A, b.R - b.w / 2);
    $(valId).setAttribute('x', f1(t[0] + 6)); $(valId).setAttribute('y', f1(t[1] - 14));
    el('text', { x: t[0] + 6, y: t[1] - 44, 'text-anchor': 'middle', class: 'unit', style: 'fill:var(--ink-3)' }, S, top + ' hp');
    el('text', { x: bt[0] - 2, y: bt[1] + 32, 'text-anchor': 'middle', class: 'cap', style: 'letter-spacing:.06em' }, S, name);
  };
  labels(ENG, '400', 'ENGINE', 'engVal');
  labels(ELE, '120', 'ELECTRIC', 'eleVal');
  /* the field's path: up the engine bar's middle (+ a 3 degree tail), across, down the electric one */
  const RE = 532 - 11, RL = 610 - 11;
  const e0 = ENG.pt(A, RE), e1 = ENG.pt(-A - TAIL, RE), l0 = ELE.pt(-A - TAIL, RL), l1 = ELE.pt(A, RL);
  const d = 'M' + e0.map(f1).join(' ') + ' A' + RE + ' ' + RE + ' 0 0 0 ' + e1.map(f1).join(' ') + ' L' + l0.map(f1).join(' ') +
    ' A' + RL + ' ' + RL + ' 0 0 1 ' + l1.map(f1).join(' ');
  $('barsPath').setAttribute('d', d); $('barsPathE').setAttribute('d', d);
  const total = $('barsPath').getTotalLength();
  const engLen = RE * 2 * A * RAD, eleLen = RL * 2 * A * RAD;
  $('barsPath').setAttribute('data-end', (total - engLen).toFixed(2));
  $('barsPathE').setAttribute('data-start', (total - eleLen).toFixed(2));
}
el('rect', { x: 1340, y: 453, width: 220, height: 2.5, fill: 'var(--ink-4)' }, S);
