     car's panel"): the two open-bottomed round dials (the same size: round
     stays round) at (428, 448) and (1500, 448), clear of the warning lights
     on the left, the parking brake light and the cut top corners; the top
     row at the panel's top edge (8 px); the power balance wider, above the
     dials' tops; boost | HV battery between the dials; the car plan over
     the bottom strip; fuel and range, oil and coolant under the dials, in
     the strip (the gear's plate and the bottom-left lights left plain).

     point, the power balance, boost with its peak, HV and 12 V batteries,
     tyres on the car plan, fuel, range, oil, coolant.
     Several readings in one font and baseline share a text layer

<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="perf1">
<meta name="theme-title" content="Performance 1">
<meta name="theme-family" content="perf1">
<meta name="theme-mode" content="sport">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="8">

<!-- shared values the bindings use -->
<meta name="let:vMph" content="smooth(mph(kmh), 12)">
<meta name="let:vRpm" content="smooth(rpm, 18)">
<meta name="let:e" content="round(smooth(engineHp, 10))">
<meta name="let:l" content="round(smooth(elecHp, 10))">
<meta name="let:bst" content="max(0, smooth(boostBar, 10))">
<meta name="let:engEnd" content="(clamp(e, 0, 400) + 100) / 500">
<meta name="let:cue" content="rpm >= P.shiftRpm">
<meta name="let:pre" content="rpm >= P.preRpm &amp;&amp; !(throttle &lt;= 0.5)">
<meta name="let:k0" content="clamp((tyres[0].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k1" content="clamp((tyres[1].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k2" content="clamp((tyres[2].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k3" content="clamp((tyres[3].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<script type="application/json" id="theme-params">
{ "shiftRpm": 6400, "lightsFrom": 4600, "preRpm": 5850, "speedMax": 180, "tachMax": 8000,
  "boostMax": 1.5, "tankL": 59, "oil": [70, 150], "cool": [50, 130], "tyreCold": 20, "tyreWarm": 90, "barGap": 0.0024,
  "rows": {
    "pw":     { "f": "f40w600", "x": 600, "w": 700 },
    "pwUnit": { "f": "f20w500", "x": 600, "w": 220 },
    "n436":   { "f": "f40w600", "x": 700, "w": 560 },
    "u436":   { "f": "f20w500", "x": 700, "w": 600 },
    "psiF":   { "f": "f30w600", "x": 840, "w": 240 },
    "tempF":  { "f": "f22w600", "x": 840, "w": 240 },
    "tempR":  { "f": "f22w600", "x": 840, "w": 240 },
    "n618s":  { "f": "f30w600", "x": 700, "w": 520 },
    "u618s":  { "f": "f20w500", "x": 700, "w": 560 },
    "nL":     { "f": "f40w600", "x": 150, "w": 400 },
    "uL":     { "f": "f20w500", "x": 150, "w": 400 },
    "nR":     { "f": "f40w600", "x": 1490, "w": 400 },
    "uR":     { "f": "f20w500", "x": 1490, "w": 410 }
  } }
</script>

<style>
/* the art's face: the mockup's variable subset (width and weight axes) */
@font-face { font-family: "ArchivoVF"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; src: url(fonts/Archivo-subset-VF.woff2) format("woff2"); }
/* the changing text's faces: static instances (the atlas page sets a weight, not a width) */
@font-face { font-family: "Archivo"; font-weight: 600; src: url(fonts/Archivo-600-108.woff2) format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 500; src: url(fonts/Archivo-500-100.woff2) format("woff2"); }
:root {
  --ground: #000000; --disc: #0b0d12; --line: #272b34; --track: #171a20;
  --ink: #f3f5f8; --ink2: #a6aebb; --ink3: #7f8896; --tick: #5c6473;
  --sport: #ff3a22; --sport-deep: #b9141a; --amber: #ffb224; --elec: #3d9bff;
}
html, body { margin: 0; background: #000; }
svg { display: block; }
svg text { font-family: "ArchivoVF", sans-serif; fill: var(--ink); }
.lab { font-size: 18px; font-weight: 500; letter-spacing: .06em; fill: var(--ink3); font-stretch: 100%; }
.unit { font-size: 20px; font-weight: 500; fill: var(--ink2); }
.dialnum { font-size: 25px; font-weight: 500; font-stretch: 104%; fill: var(--tick); text-anchor: middle; }
.dialnum.on { fill: var(--ink); }
.dialnum.red { fill: var(--sport); }
.scale { font-size: 16px; font-weight: 500; fill: var(--ink3); }
/* marked text: the atlases' faces, tabular figures */
svg text.n { font-family: "Archivo", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; fill: var(--ink); }
svg text.u { font-family: "Archivo", sans-serif; font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; fill: var(--ink2); }
.guide { fill: none; stroke: var(--sport); }
</style>

  <path id="speedPath" d="M209.2 584.72 A258 258 0 1 1 646.8 584.72" fill="none" stroke="none"

  <g data-leds="lights" data-count="12" data-light="44 24" data-split="8 8" data-radius="2"

     data-lit="when(ok(rpm), when(cue, 12, floor(clamp((rpm - P.lightsFrom) / (P.shiftRpm - P.lightsFrom)) * 12 + 0.001)), 0)"
     data-flash="when(cue, when(flash(2.5), 1, 2), 0)">
    <rect x="648" y="14" width="624" height="24" fill="none"/>

  <text class="n" x="536" y="38" text-anchor="end" style="font-size:26px" data-text="clock" data-rate="1"

  <text class="n" x="628" y="38" text-anchor="end" style="font-size:26px;fill:var(--ink2)" data-text="outside" data-rate="1" data-glyphs="−"
        data-text-expr="when(outsideC &lt; 0, '−' + fmt(-outsideC), fmt(outsideC)) + ' °C'">18 °C</text>

  <!-- ===== the rev counter's centre: M, the gear, rpm ===== -->
  <text class="n" x="1466" y="490" text-anchor="end" style="font-size:40px;fill:var(--ink2)" data-text="gearMode" data-glyphs="MDS"
        data-text-expr="when(/^[MDS]$/.test(gearMode), gearMode, ' ')" data-color="when(cue, C.ink, C.ink2)">M</text>
  <text class="n" x="1518" y="490" text-anchor="middle" style="font-size:144px" data-text="gear" data-glyphs="N-"
        data-text-expr="when(!ok(gear), '-', when(gear === 0, 'N', fmt(gear)))">4</text>
  <text class="n" x="1522" y="544" text-anchor="end" style="font-size:30px" data-text="rpm" data-rate="10"
        data-text-expr="fmt(round(vRpm, 10)).replace(/\B(?=(\d{3})+(?!\d))/g, ',')">5,240</text>
  <text class="u" x="1530" y="544" data-text="rpmUnit" data-text-expr="'rpm'" data-color="when(cue, C.ink, C.ink2)">rpm</text>

  <!-- the speedometer's centre -->
  <text class="n" x="428" y="492" text-anchor="middle" style="font-size:136px" data-text="speed"
        data-text-expr="fmt(vMph)">93</text>

  <!-- ===== power balance, above the dials: figures, then the bar (engine right of zero, electric stacked on it, regen left of zero) ===== -->
  <text class="n" x="960" y="146" text-anchor="middle" style="font-size:88px" data-text="sys" data-rate="10" data-glyphs="−"
        data-text-expr="when(e + l &lt; 0, '−' + fmt(-(e + l)), fmt(e + l))">386</text>
  <!-- rows: the engine figure from 600, the electric one ending at 1288 (signed); "hp" 8 px after the engine's -->
  <text class="n" x="600" y="130" style="font-size:40px" data-text="pw" data-width="700" data-text-expr="''" data-glyphs="+−">281</text>
  <text data-guide class="n" x="1288" y="130" text-anchor="end" style="font-size:40px">+105</text>
  <text class="u" x="600" y="130" data-text="pwUnit" data-width="220" data-text-expr="''" data-glyphs="hp">hp</text>
  <!-- the bar: one field along y 175; the electric fill is the engine's field again (a copy, not moved) -->
  <path d="M600 175 L1320 175" fill="none" style="stroke:var(--sport)" stroke-width="22"
        data-gauge="engBar" data-art="off" data-band="-11 11" data-show="e >= 1"
        data-value="engEnd" data-from="0.2 + P.barGap"/>
  <path d="M600 175 L1320 175" fill="none" style="stroke:var(--elec)" stroke-width="22"
        data-gauge="elBar" data-reuse="engBar" data-art="off" data-band="-11 11" data-show="abs(l) >= 1"
        data-value="when(l > 0, (clamp(e, 0, 400) + clamp(l, 0, 400) + 100) / 500, (max(l, -100) + 100) / 500)"
        data-from="when(l > 0, engEnd, 0.2 - P.barGap)"/>

  <!-- ===== boost | HV battery between the dials (numbers at y 302) ===== -->
  <text class="n" x="700" y="302" style="font-size:40px" data-text="n436" data-width="560" data-text-expr="''">1.23</text>
  <text data-guide class="n" x="1058" y="302" style="font-size:40px">66</text>
  <text class="u" x="700" y="302" data-text="u436" data-width="600" data-text-expr="''" data-glyphs="bar%">bar</text>
  <g data-leds="boostBar" data-count="64" data-light="3.5 8" data-c0="C.sport" data-off="'transparent'"
     data-lit="round(clamp(bst / P.boostMax) * 64)">
    <rect x="700" y="316" width="160" height="8" fill="none"/>
  </g>
  <!-- the peak of the pull (logic.extra.js keeps it and moves the mark) -->
  <rect x="699" y="312" width="3" height="16" style="fill:var(--ink)" data-rect="peakMark" data-dx="0"/>
  <text class="n" x="860" y="380" text-anchor="end" style="font-size:22px" data-text="peak" data-text-expr="'--'" data-glyphs="0123456789.">1.35</text>
  <g data-leds="hv" data-count="10" data-light="14.2 8" data-radius="1" data-c0="C.elec" data-off="'transparent'"
     data-lit="round(socPct / 10)" data-rate="10">
    <rect x="1057" y="316" width="162" height="8" fill="none"/>
  </g>
  <text class="u" x="1058" y="380" data-text="hvState" data-rate="10"
        data-text-expr="when(ok(elecHp), when(l > 8, 'ASSISTING', when(l &lt; -4, 'CHARGING', 'HOLDING')), '')"
        data-color="when(abs(l) > 8 || l &lt; -4, C.elec, C.ink3)">ASSISTING</text>

  <!-- ===== tyres on the car plan: pressure (psi) over temperature, the block cold grey to warm white ===== -->
  <text class="n" x="840" y="436" style="font-size:30px" data-text="psiF" data-width="240" data-text-expr="''" data-rate="10">35</text>
  <text class="n" x="840" y="462" style="font-size:22px;fill:var(--ink2)" data-text="tempF" data-width="240" data-text-expr="''" data-rate="10">37</text>
  <text class="n" x="840" y="644" style="font-size:22px;fill:var(--ink2)" data-text="tempR" data-width="240" data-text-expr="''" data-rate="10">40</text>
  <g data-leds="tyresF" data-count="2" data-light="14 50" data-split="1 2" data-radius="4" data-lean="0 84 0" data-off="'transparent'"
     data-lit="2" data-rate="10"
     data-c0="rgb(92 + 151 * when(ok(k0), k0, 0), 100 + 145 * when(ok(k0), k0, 0), 115 + 133 * when(ok(k0), k0, 0))"
     data-c1="rgb(92 + 151 * when(ok(k1), k1, 0), 100 + 145 * when(ok(k1), k1, 0), 115 + 133 * when(ok(k1), k1, 0))">
    <rect x="904" y="414" width="112" height="50" fill="none"/>
  </g>
  <g data-leds="tyresR" data-count="2" data-light="14 50" data-split="1 2" data-radius="4" data-lean="0 84 0" data-off="'transparent'"
     data-lit="2" data-rate="10"
     data-c0="rgb(92 + 151 * when(ok(k2), k2, 0), 100 + 145 * when(ok(k2), k2, 0), 115 + 133 * when(ok(k2), k2, 0))"
     data-c1="rgb(92 + 151 * when(ok(k3), k3, 0), 100 + 145 * when(ok(k3), k3, 0), 115 + 133 * when(ok(k3), k3, 0))">
    <rect x="904" y="582" width="112" height="50" fill="none"/>
  </g>

  <!-- ===== the row at y 618: 12 V, rear pressures, electric range (f30) and their units ===== -->
  <text class="n" x="700" y="618" style="font-size:30px" data-text="n618s" data-width="520" data-text-expr="''" data-rate="10">14.3</text>
  <text class="u" x="700" y="618" data-text="u618s" data-width="560" data-text-expr="''" data-glyphs="Vmi" data-rate="10">V</text>

  <!-- ===== under the dials, in the bottom strip (y 664): fuel, range | oil, coolant (f40) and their units ===== -->
  <text class="n" x="150" y="664" style="font-size:40px" data-text="nL" data-width="400" data-text-expr="''" data-rate="10">38</text>
  <text class="u" x="150" y="664" data-text="uL" data-width="400" data-text-expr="''" data-glyphs="miL" data-rate="10">mi</text>
  <text class="n" x="1490" y="664" style="font-size:40px" data-text="nR" data-width="400" data-text-expr="''" data-rate="10">96</text>
  <text class="u" x="1490" y="664" data-text="uR" data-width="410" data-text-expr="''" data-glyphs="°C" data-rate="10">°C</text>
  <g data-leds="fuelBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"
     data-lit="round(clamp(fuelPct / 100) * 50)">
    <rect x="150" y="674" width="150" height="8" fill="none"/>
  </g>
  <g data-leds="oilBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"

    <rect x="1490" y="674" width="150" height="8" fill="none"/>
  </g>
  <g data-leds="coolBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"
     data-lit="round(clamp((coolantC - P.cool[0]) / (P.cool[1] - P.cool[0])) * 50)">
    <rect x="1700" y="674" width="150" height="8" fill="none"/>
  </g>
</svg>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg', root = document.getElementById('art');
  var P = JSON.parse(document.getElementById('theme-params').textContent);
  function css(n) { return 'var(--' + n + ')'; }
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || root).appendChild(e); return e; }
  function T(x, y, str, cls, anchor, parent) { var t = el('text', { x: x, y: y, 'class': cls || '', 'text-anchor': anchor || 'start' }, parent); t.textContent = str; return t; }
  function pol(cx, cy, r, a) { var k = a * Math.PI / 180; return [cx + r * Math.sin(k), cy - r * Math.cos(k)]; }
  function arc(cx, cy, r, a0, a1) { var p = pol(cx, cy, r, a0), q = pol(cx, cy, r, a1);
    return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- the dials: track, red zone, ticks, numerals (at rest: 0 lit), the shift mark, the disc ---------- */
  var A0 = -120, A1 = 120, SX = 428, TX = 1500, CY = 448;
  function Dial(cx, cy, o) {
    var ang = function (v) { return A0 + clamp(v / o.max, 0, 1) * (A1 - A0); };
    el('path', { d: arc(cx, cy, 272, A0, A1), fill: 'none', stroke: css('track'), 'stroke-width': 8 });
    if (o.redFrom != null) el('path', { d: arc(cx, cy, 278, ang(o.redFrom), A1), fill: 'none', stroke: css('sport-deep'), 'stroke-width': 20 });
    for (var v = 0; v <= o.max + 1e-6; v += o.minor) {
      var major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6, a = ang(v), red = o.redFrom != null && v >= o.redFrom;
      var p = pol(cx, cy, 262, a), q = pol(cx, cy, major ? 240 : 251, a);
      el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: red ? css('sport') : major ? css('ink') : css('tick'), 'stroke-width': major ? 3 : 1.5 });
      if (major) { var c = pol(cx, cy, 205, a); T(c[0], c[1] + 9, o.label(v), 'dialnum' + (red ? ' red' : v === 0 ? ' on' : ''), 'middle'); }
    }
    if (o.mark != null) el('path', { d: 'M0 -264 L-9 -292 L9 -292 Z', fill: css('amber'), transform: 'translate(' + cx + ' ' + cy + ') rotate(' + ang(o.mark) + ')' });
    el('circle', { cx: cx, cy: cy, r: 158, fill: css('disc'), stroke: css('line'), 'stroke-width': 1.5 });
  }
  Dial(SX, CY, { max: P.speedMax, major: 20, minor: 10, label: function (v) { return v; } });
  Dial(TX, CY, { max: P.tachMax, major: 1000, minor: 250, label: function (v) { return v / 1000; }, redFrom: 7000, mark: P.shiftRpm });
  T(SX, CY + 92, 'mph', 'unit', 'middle').setAttribute('font-size', 24);

  /* ---------- top row: the unlit lights, the mode and the shift point ---------- */
