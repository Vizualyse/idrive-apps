     perf1 "Performance 1" (Sport): the perf-fable Sport mockup as a design
     (DESIGNS.md), re-laid out for the whole 1920 x 720 panel. Two
     open-bottomed round dials (the same size: round stays round) moved down
     to the panel's middle (y 372), the top row below the 40 px keep-clear
     zone, the centre stack and the readings under the dials spread over the
     height, the car plan and the bars' scales reaching into the old bottom
     strip. Twelve shift lights, a rev counter whose centre floods red at the
     shift point, the power balance, boost with its peak, HV and 12 V
     batteries, tyres on the car plan, fuel, range, oil, coolant.
     Several readings in one font and baseline share a text layer
     ("rows", laid out by logic.extra.js). Archivo (OFL): the variable subset
     for the art, its static instances for the glyph atlases (fonts/).
     Build: node tools/design_build.js themes/perf1 -->
<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="perf1">
<meta name="theme-title" content="Performance 1">
<meta name="theme-family" content="perf1">
<meta name="theme-mode" content="sport">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="40">

<!-- shared values the bindings use -->
<meta name="let:vMph" content="smooth(mph(kmh), 12)">
<meta name="let:vRpm" content="smooth(rpm, 18)">
<meta name="let:e" content="round(smooth(engineHp, 10))">
<meta name="let:l" content="round(smooth(elecHp, 10))">
<meta name="let:bst" content="max(0, smooth(boostBar, 10))">
<meta name="let:engEnd" content="(clamp(e, 0, 400) + 100) / 500">
<meta name="let:cue" content="rpm >= P.shiftRpm">
<meta name="let:pre" content="rpm >= P.preRpm &amp;&amp; !(throttle &lt;= 0.5)">
<meta name="let:k0" content="clamp((tyres[0].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k1" content="clamp((tyres[1].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k2" content="clamp((tyres[2].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<meta name="let:k3" content="clamp((tyres[3].c - P.tyreCold) / (P.tyreWarm - P.tyreCold))">
<script type="application/json" id="theme-params">
{ "shiftRpm": 6400, "lightsFrom": 4600, "preRpm": 5850, "speedMax": 180, "tachMax": 8000,
  "boostMax": 1.5, "tankL": 59, "oil": [70, 150], "cool": [50, 130], "tyreCold": 20, "tyreWarm": 90, "barGap": 0.0024,
  "rows": {
    "pw":     { "f": "f40w600", "x": 648, "w": 600 },
    "pwUnit": { "f": "f20w500", "x": 648, "w": 220 },
    "n436":   { "f": "f36w600", "x": 648, "w": 600 },
    "u436":   { "f": "f20w500", "x": 648, "w": 640 },
    "psiF":   { "f": "f30w600", "x": 840, "w": 240 },
    "tempF":  { "f": "f22w600", "x": 840, "w": 240 },
    "tempR":  { "f": "f22w600", "x": 840, "w": 240 },
    "n618s":  { "f": "f30w600", "x": 648, "w": 620 },
    "n618":   { "f": "f36w600", "x": 170, "w": 1690 },
    "u618":   { "f": "f20w500", "x": 170, "w": 1700 }
  } }
</script>

<style>
/* the art's face: the mockup's variable subset (width and weight axes) */
@font-face { font-family: "ArchivoVF"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; src: url(fonts/Archivo-subset-VF.woff2) format("woff2"); }
/* the changing text's faces: static instances (the atlas page sets a weight, not a width) */
@font-face { font-family: "Archivo"; font-weight: 600; src: url(fonts/Archivo-600-108.woff2) format("woff2"); }
@font-face { font-family: "Archivo"; font-weight: 500; src: url(fonts/Archivo-500-100.woff2) format("woff2"); }
:root {
  --ground: #000000; --disc: #0b0d12; --line: #272b34; --track: #171a20;
  --ink: #f3f5f8; --ink2: #a6aebb; --ink3: #7f8896; --tick: #5c6473;
  --sport: #ff3a22; --sport-deep: #b9141a; --amber: #ffb224; --elec: #3d9bff;
}
html, body { margin: 0; background: #000; }
svg { display: block; }
svg text { font-family: "ArchivoVF", sans-serif; fill: var(--ink); }
.lab { font-size: 18px; font-weight: 500; letter-spacing: .06em; fill: var(--ink3); font-stretch: 100%; }
.unit { font-size: 20px; font-weight: 500; fill: var(--ink2); }
.dialnum { font-size: 23px; font-weight: 500; font-stretch: 104%; fill: var(--tick); text-anchor: middle; }
.dialnum.on { fill: var(--ink); }
.dialnum.red { fill: var(--sport); }
.scale { font-size: 16px; font-weight: 500; fill: var(--ink3); }
/* marked text: the atlases' faces, tabular figures */
svg text.n { font-family: "Archivo", sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; fill: var(--ink); }
svg text.u { font-family: "Archivo", sans-serif; font-weight: 500; font-size: 20px; font-variant-numeric: tabular-nums; fill: var(--ink2); }
.guide { fill: none; stroke: var(--sport); }
</style>
</head>
<body>
<svg id="cluster" width="1920" height="720" viewBox="0 0 1920 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3a6" stroke-width="3"/>
    </pattern>
  </defs>
  <!-- guides (not drawn by the theme): the top keep-clear zone, the old bottom strip's edge -->
  <rect data-guide x="0" y="0" width="1920" height="40" fill="url(#hatch)" opacity="0.5"/>
  <line data-guide x1="0" y1="646" x2="1920" y2="646" stroke="#3a6" stroke-dasharray="6 8"/>

  <!-- the static art (dials, scales, labels, tracks, the car) is drawn by the script below -->
  <g id="art"></g>

  <!-- ===== the dials: one field, the rev counter's a copy of the speedometer's moved 1260 px =====
       The path runs at r 258 (the swept band's outer edge) clockwise from -122 to 122 degrees
       (2 degrees past the scale's ends, so the needle at an end shows whole); the scale runs
       9 px in from each end. Value arc r 268..276 (d -18..-10), needle r 232..284, a glow 100 px
       deep (cut at r 190, the numerals' inner edge) brightening the tick-grey numerals it passes. -->
  <path id="speedPath" d="M111.2 508.72 A258 258 0 1 1 548.8 508.72" fill="none" stroke="none"
        data-gauge="speedDial" data-start="9.006" data-end="9.006" data-maxd="68"
        data-value="vMph / P.speedMax"
        data-band="-18 -10" data-band-color="C.sport"
        data-needle="-26 26 7" data-needle-color="#ff9a8a"
        data-glow="100 180.1 0.35" data-glow-color="rgb(107, 24, 14)"
        data-pool="18 1.8 0" data-look="0 10 1"/>
  <path id="tachPath" d="M1371.2 508.72 A258 258 0 1 1 1808.8 508.72" fill="none" stroke="none"
        data-gauge="tachDial" data-reuse="speedDial" data-start="9.006" data-end="9.006" data-maxd="68"
        data-value="vRpm / P.tachMax"
        data-band="-18 -10" data-band-color="C.sport"
        data-needle="-26 26 7" data-needle-color="#ff9a8a"
        data-glow="100 180.1 0.35" data-glow-color="rgb(107, 24, 14)"
        data-pool="18 1.8 0" data-look="0 10 1"/>
  <!-- the design's view of a sweep (a guide): the value arc to 93 mph and the needle -->
  <path data-guide d="M94.44 508 A272 272 0 0 1 348.97 100.66" fill="none" stroke="#ff3a22" stroke-width="8"/>
  <line data-guide x1="346.18" y1="140.57" x2="349.81" y2="88.69" stroke="#ff9a8a" stroke-width="5" stroke-linecap="round"/>

  <!-- the rev counter's centre floods red at the shift point -->
  <circle cx="1590" cy="372" r="158" style="fill:var(--sport-deep);stroke:var(--line);stroke-width:1.5"
          data-rect="flood" data-show="cue"/>
  <!-- the upshift chevron (1556,284)-(1590,254)-(1624,284), 9 wide: two sheared lights, the right half leaning back;
       amber from just before the shift point, white at it -->
  <g data-leds="chevron" data-count="2" data-light="13.6 38" data-radius="2" data-halo="1" data-lean="43 20.4 1"
     data-lit="when(cue || pre, 2, 0)" data-c0="when(cue, C.ink, alpha(C.amber, 0.9))" data-c1="when(cue, C.ink, alpha(C.amber, 0.9))"
     data-off="'transparent'">
    <rect x="1545" y="250" width="91" height="38" fill="none"/>
  </g>

  <!-- ===== top row: time, outside, twelve shift lights (8 amber, 4 red; all red flashing at the shift point) ===== -->
  <g data-leds="lights" data-count="12" data-light="30 20" data-split="8 8" data-radius="2"
     data-c0="C.amber" data-c1="C.amber" data-c2="C.sport" data-off="C.track"
     data-lit="when(ok(rpm), when(cue, 12, floor(clamp((rpm - P.lightsFrom) / (P.shiftRpm - P.lightsFrom)) * 12 + 0.001)), 0)"
     data-flash="when(cue, when(flash(2.5), 1, 2), 0)">
    <rect x="744" y="51" width="432" height="20" fill="none"/>
  </g>
  <text class="n" x="640" y="70" text-anchor="end" style="font-size:22px" data-text="clock" data-rate="1"
        data-text-expr="when(/^\d{1,2}:\d{2}$/.test(clock), clock, '--:--')">18:29</text>
  <text class="n" x="722" y="70" text-anchor="end" style="font-size:22px;fill:var(--ink2)" data-text="outside" data-rate="1" data-glyphs="−"
        data-text-expr="when(outsideC &lt; 0, '−' + fmt(-outsideC), fmt(outsideC)) + ' °C'">18 °C</text>

  <!-- ===== the rev counter's centre: M, the gear, rpm ===== -->
  <text class="n" x="1560" y="406" text-anchor="end" style="font-size:46px;fill:var(--ink2)" data-text="gearMode" data-glyphs="MDS"
        data-text-expr="when(/^[MDS]$/.test(gearMode), gearMode, ' ')" data-color="when(cue, C.ink, C.ink2)">M</text>
  <text class="n" x="1608" y="406" text-anchor="middle" style="font-size:128px" data-text="gear" data-glyphs="N-"
        data-text-expr="when(!ok(gear), '-', when(gear === 0, 'N', fmt(gear)))">4</text>
  <text class="n" x="1612" y="460" text-anchor="end" style="font-size:30px" data-text="rpm" data-rate="10"
        data-text-expr="fmt(round(vRpm, 10)).replace(/\B(?=(\d{3})+(?!\d))/g, ',')">5,240</text>
  <text class="u" x="1620" y="460" data-text="rpmUnit" data-text-expr="'rpm'" data-color="when(cue, C.ink, C.ink2)">rpm</text>

  <!-- the speedometer's centre -->
  <text class="n" x="330" y="406" text-anchor="middle" style="font-size:116px" data-text="speed"
        data-text-expr="fmt(vMph)">93</text>

  <!-- ===== power balance: figures, then the bar (engine right of zero, electric stacked on it, regen left of zero) ===== -->
  <text class="n" x="948" y="224" text-anchor="middle" style="font-size:80px" data-text="sys" data-rate="10" data-glyphs="−"
        data-text-expr="when(e + l &lt; 0, '−' + fmt(-(e + l)), fmt(e + l))">386</text>
  <!-- rows: the engine figure from 648, the electric one ending at 1240 (signed); "hp" 8 px after the engine's -->
  <text class="n" x="648" y="208" style="font-size:40px" data-text="pw" data-width="600" data-text-expr="''" data-glyphs="+−">281</text>
  <text data-guide class="n" x="1240" y="208" text-anchor="end" style="font-size:40px">+105</text>
  <text class="u" x="648" y="208" data-text="pwUnit" data-width="220" data-text-expr="''" data-glyphs="hp">hp</text>
  <!-- the bar: one field along y 259; the electric fill is the engine's field again (a copy, not moved) -->
  <path d="M648 259 L1272 259" fill="none" style="stroke:var(--sport)" stroke-width="22"
        data-gauge="engBar" data-art="off" data-band="-11 11" data-show="e >= 1"
        data-value="engEnd" data-from="0.2 + P.barGap"/>
  <path d="M648 259 L1272 259" fill="none" style="stroke:var(--elec)" stroke-width="22"
        data-gauge="elBar" data-reuse="engBar" data-art="off" data-band="-11 11" data-show="abs(l) >= 1"
        data-value="when(l > 0, (clamp(e, 0, 400) + clamp(l, 0, 400) + 100) / 500, (max(l, -100) + 100) / 500)"
        data-from="when(l > 0, engEnd, 0.2 - P.barGap)"/>

  <!-- ===== boost | HV battery (numbers at y 436) ===== -->
  <text class="n" x="648" y="436" style="font-size:36px" data-text="n436" data-width="600" data-text-expr="''">1.23</text>
  <text data-guide class="n" x="1112" y="436" style="font-size:36px">66</text>
  <text class="u" x="648" y="436" data-text="u436" data-width="640" data-text-expr="''" data-glyphs="bar%">bar</text>
  <g data-leds="boostBar" data-count="64" data-light="3.5 8" data-c0="C.sport" data-off="'transparent'"
     data-lit="round(clamp(bst / P.boostMax) * 64)">
    <rect x="648" y="450" width="160" height="8" fill="none"/>
  </g>
  <!-- the peak of the pull (logic.extra.js keeps it and moves the mark) -->
  <rect x="647" y="446" width="3" height="16" style="fill:var(--ink)" data-rect="peakMark" data-dx="0"/>
  <text class="n" x="808" y="514" text-anchor="end" style="font-size:22px" data-text="peak" data-text-expr="'--'" data-glyphs="0123456789.">1.35</text>
  <g data-leds="hv" data-count="10" data-light="14.2 8" data-radius="1" data-c0="C.elec" data-off="'transparent'"
     data-lit="round(socPct / 10)" data-rate="10">
    <rect x="1111" y="450" width="162" height="8" fill="none"/>
  </g>
  <text class="u" x="1112" y="514" data-text="hvState" data-rate="10"
        data-text-expr="when(ok(elecHp), when(l > 8, 'ASSISTING', when(l &lt; -4, 'CHARGING', 'HOLDING')), '')"
        data-color="when(abs(l) > 8 || l &lt; -4, C.elec, C.ink3)">ASSISTING</text>

  <!-- ===== tyres on the car plan: pressure (psi) over temperature, the block cold grey to warm white ===== -->
  <text class="n" x="840" y="436" style="font-size:30px" data-text="psiF" data-width="240" data-text-expr="''" data-rate="10">35</text>
  <text class="n" x="840" y="462" style="font-size:22px;fill:var(--ink2)" data-text="tempF" data-width="240" data-text-expr="''" data-rate="10">37</text>
  <text class="n" x="840" y="644" style="font-size:22px;fill:var(--ink2)" data-text="tempR" data-width="240" data-text-expr="''" data-rate="10">40</text>
  <g data-leds="tyresF" data-count="2" data-light="14 50" data-split="1 2" data-radius="4" data-lean="0 84 0" data-off="'transparent'"
     data-lit="2" data-rate="10"
     data-c0="rgb(92 + 151 * when(ok(k0), k0, 0), 100 + 145 * when(ok(k0), k0, 0), 115 + 133 * when(ok(k0), k0, 0))"
     data-c1="rgb(92 + 151 * when(ok(k1), k1, 0), 100 + 145 * when(ok(k1), k1, 0), 115 + 133 * when(ok(k1), k1, 0))">
    <rect x="904" y="414" width="112" height="50" fill="none"/>
  </g>
  <g data-leds="tyresR" data-count="2" data-light="14 50" data-split="1 2" data-radius="4" data-lean="0 84 0" data-off="'transparent'"
     data-lit="2" data-rate="10"
     data-c0="rgb(92 + 151 * when(ok(k2), k2, 0), 100 + 145 * when(ok(k2), k2, 0), 115 + 133 * when(ok(k2), k2, 0))"
     data-c1="rgb(92 + 151 * when(ok(k3), k3, 0), 100 + 145 * when(ok(k3), k3, 0), 115 + 133 * when(ok(k3), k3, 0))">
    <rect x="904" y="582" width="112" height="50" fill="none"/>
  </g>

  <!-- ===== the row at y 618: 12 V, rear pressures, electric range (f30); fuel, range, oil, coolant (f36); their units ===== -->
  <text class="n" x="648" y="618" style="font-size:30px" data-text="n618s" data-width="620" data-text-expr="''" data-rate="10">14.3</text>
  <text class="n" x="170" y="618" style="font-size:36px" data-text="n618" data-width="1690" data-text-expr="''" data-rate="10">38</text>
  <text class="u" x="170" y="618" data-text="u618" data-width="1700" data-text-expr="''" data-glyphs="VmiL°C" data-rate="10">mi</text>
  <g data-leds="fuelBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"
     data-lit="round(clamp(fuelPct / 100) * 50)">
    <rect x="170" y="632" width="150" height="8" fill="none"/>
  </g>
  <g data-leds="oilBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"
     data-lit="round(clamp((oilC - P.oil[0]) / (P.oil[1] - P.oil[0])) * 50)">
    <rect x="1430" y="632" width="150" height="8" fill="none"/>
  </g>
  <g data-leds="coolBar" data-count="50" data-light="4 8" data-c0="C.ink" data-off="'transparent'" data-rate="10"
     data-lit="round(clamp((coolantC - P.cool[0]) / (P.cool[1] - P.cool[0])) * 50)">
    <rect x="1610" y="632" width="150" height="8" fill="none"/>
  </g>
</svg>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg', root = document.getElementById('art');
  var P = JSON.parse(document.getElementById('theme-params').textContent);
  function css(n) { return 'var(--' + n + ')'; }
  function el(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); (parent || root).appendChild(e); return e; }
  function T(x, y, str, cls, anchor, parent) { var t = el('text', { x: x, y: y, 'class': cls || '', 'text-anchor': anchor || 'start' }, parent); t.textContent = str; return t; }
  function pol(cx, cy, r, a) { var k = a * Math.PI / 180; return [cx + r * Math.sin(k), cy - r * Math.cos(k)]; }
  function arc(cx, cy, r, a0, a1) { var p = pol(cx, cy, r, a0), q = pol(cx, cy, r, a1);
    return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + ((a1 - a0) > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ---------- the dials: track, red zone, ticks, numerals (at rest: 0 lit), the shift mark, the disc ---------- */
  var A0 = -120, A1 = 120, SX = 330, TX = 1590, CY = 372;
  function Dial(cx, cy, o) {
    var ang = function (v) { return A0 + clamp(v / o.max, 0, 1) * (A1 - A0); };
    el('path', { d: arc(cx, cy, 272, A0, A1), fill: 'none', stroke: css('track'), 'stroke-width': 8 });
    if (o.redFrom != null) el('path', { d: arc(cx, cy, 278, ang(o.redFrom), A1), fill: 'none', stroke: css('sport-deep'), 'stroke-width': 20 });
    for (var v = 0; v <= o.max + 1e-6; v += o.minor) {
      var major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6, a = ang(v), red = o.redFrom != null && v >= o.redFrom;
      var p = pol(cx, cy, 262, a), q = pol(cx, cy, major ? 240 : 251, a);
      el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: red ? css('sport') : major ? css('ink') : css('tick'), 'stroke-width': major ? 3 : 1.5 });
      if (major) { var c = pol(cx, cy, 205, a); T(c[0], c[1] + 8, o.label(v), 'dialnum' + (red ? ' red' : v === 0 ? ' on' : ''), 'middle'); }
    }
    if (o.mark != null) el('path', { d: 'M0 -264 L-9 -292 L9 -292 Z', fill: css('amber'), transform: 'translate(' + cx + ' ' + cy + ') rotate(' + ang(o.mark) + ')' });
    el('circle', { cx: cx, cy: cy, r: 158, fill: css('disc'), stroke: css('line'), 'stroke-width': 1.5 });
  }
  Dial(SX, CY, { max: P.speedMax, major: 20, minor: 10, label: function (v) { return v; } });
  Dial(TX, CY, { max: P.tachMax, major: 1000, minor: 250, label: function (v) { return v / 1000; }, redFrom: 7000, mark: P.shiftRpm });
  T(SX, CY + 80, 'mph', 'unit', 'middle').setAttribute('font-size', 22);

  /* ---------- top row: the unlit lights, the mode and the shift point ---------- */
  for (var i = 0; i < 12; i++) el('rect', { x: 747 + i * 36, y: 51, width: 30, height: 20, rx: 2, fill: css('track') });
  var mode = T(1198, 70, 'SPORT', ''); mode.setAttribute('style', 'font-size:24px;font-weight:700;font-stretch:108%;letter-spacing:.08em;fill:var(--sport)');
  el('path', { d: 'M1312 53 L1328 53 L1320 69 Z', fill: css('amber') });
  var sp = T(1336, 70, String(P.shiftRpm).replace(/\B(?=(\d{3})+(?!\d))/g, ','), '');
  sp.setAttribute('style', 'font-size:24px;font-weight:500;font-stretch:108%;fill:var(--ink2)');

  /* ---------- power balance: labels, the bar's track, scale and zero line ---------- */
  var PX0 = 648, PX1 = 1272, PMIN = -100, PMAX = 400;
  function px(v) { return PX0 + (clamp(v, PMIN, PMAX) - PMIN) / (PMAX - PMIN) * (PX1 - PX0); }
  el('rect', { x: PX0, y: 140, width: 10, height: 10, fill: css('sport') }); T(PX0 + 18, 150, 'ENGINE', 'lab');
  T(960, 150, 'SYSTEM POWER', 'lab', 'middle');
  T(PX1 - 18, 150, 'ELECTRIC', 'lab', 'end'); el('rect', { x: PX1 - 10, y: 140, width: 10, height: 10, fill: css('elec') });
  T(1032, 224, 'hp', 'unit').setAttribute('font-size', 24);
  T(PX1, 208, 'hp', 'unit', 'end');
  el('rect', { x: PX0, y: 248, width: PX1 - PX0, height: 22, rx: 1, fill: css('track') });
