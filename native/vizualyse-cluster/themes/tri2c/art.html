     Three-dial 2: everything that never moves, drawn as the mockup draws it
     (faces, grooves, ticks, numerals, rims, the unlit shift ladder, tyre
     plates, column outlines, icons, labels and units), from geom.js, which
     gen.js writes with the layers. The grooves are drawn LIT: the layers dim
     them past the revs and the power (and tint the electric stretch).
     Archivo: SIL OFL 1.1, fonts/OFL.txt. -->
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #000; width: 1920px; height: 646px; overflow: hidden; }
svg { display: block; width: 1920px; height: 646px; font-family: "Archivo"; font-variant-numeric: tabular-nums lining-nums; }
</style>
<body>
<svg id="s" viewBox="0 0 1920 646" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="face" cx="50%" cy="46%" r="55%">
      <stop offset="0" stop-color="oklch(0.165 0.014 228)"/>
      <stop offset="0.75" stop-color="oklch(0.115 0.010 228)"/>
      <stop offset="1" stop-color="oklch(0.085 0.007 228)"/>
    </radialGradient>
    <radialGradient id="faceSm" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="oklch(0.145 0.012 228)"/>
      <stop offset="1" stop-color="oklch(0.090 0.007 228)"/>
    </radialGradient>
  </defs>
</svg>
<script src="geom.js"></script>
<script>
'use strict';
const { G, C, P0 } = window.GEOM;
const COMFORT = GEOM.mode === 'comfort';
/* the font, relative to this page (Comfort's page is in themes/tri2c) */
document.head.insertAdjacentHTML('beforeend', '<style>@font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; ' +
  'font-stretch: 62% 125%; font-display: block; src: url(' + (COMFORT ? '../tri2/' : '') + 'fonts/Archivo-latin.woff2) format("woff2"); }</style>');
const NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('s');
const el = (tag, attrs, parent, text) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  (parent || svg).appendChild(n);
  return n;
};
const rad = (d) => d * Math.PI / 180;
const pt = (cx, cy, r, a) => [cx + r * Math.sin(rad(a)), cy - r * Math.cos(rad(a))];
const arc = (cx, cy, r, a0, a1) => {
  const [x0, y0] = pt(cx, cy, r, a0), [x1, y1] = pt(cx, cy, r, a1);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${x1.toFixed(2)} ${y1.toFixed(2)}`;
};
/* type styles: size, weight, width (font-stretch), colour, letter-spacing, transform */
const T = {
  lbl: [15, 500, 78, C.z7, '0.06em', 'uppercase'], unit: [18, 450, 90, C.z7], tick: [25, 480, 100, C.z8],
  gm: [92, 560, 100, C.z6], sport: [21, 700, 125, C.signal, '0.24em'], meta: [17, 450, 96, C.z7],
  row: [16, 450, 90, C.z8], zone: [14, 600, 80, C.z7, '.1em', 'uppercase'], cap: [13, 500, 85, C.z7, '.14em', 'uppercase'],
  cgear: [50, 560, 104, C.z10], mode: [21, 700, 125, C.z8, '0.24em'], tc: [13, 600, 80, C.z7, '.08em'], small: [17, 450, 96, C.z7],
};
function txt(style, x, y, s, anchor, fill, size) {
  const t = T[style];
  return el('text', { x, y, 'text-anchor': anchor || 'middle', 'font-size': size || t[0], 'font-weight': t[1],
    'font-stretch': t[2] + '%', fill: fill || t[3], 'letter-spacing': t[4] || 0, style: t[5] ? 'text-transform:' + t[5] : '' }, null, s);
}

/* ---------- centre dial: revs ---------- */
const A = G.tach;
const revA = (r) => A.a0 + (A.a1 - A.a0) * Math.max(0, Math.min(A.max, r)) / A.max;
el('circle', { cx: A.cx, cy: A.cy, r: A.face, fill: 'url(#face)' });
for (let r = A.grooves[0]; r <= A.grooves[1]; r += A.grooves[2])
  el('path', { d: arc(A.cx, A.cy, r, A.a0, A.a1), fill: 'none', stroke: COMFORT ? C.z8 : C.z10, 'stroke-width': COMFORT ? 1.4 : 1.5 });
el('path', { d: arc(A.cx, A.cy, 272, revA(A.red), revA(A.max)), fill: 'none', stroke: C.signal, 'stroke-width': COMFORT ? 4 : 6 });
for (let v = 0; v <= A.max; v += 250) {
  const a = revA(v), major = v % 1000 === 0, half = v % 500 === 0, far = COMFORT && v > 4000;
  const [x0, y0] = pt(A.cx, A.cy, major ? 266 : half ? 268 : 270, a), [x1, y1] = pt(A.cx, A.cy, 276, a);
  el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: v >= A.red ? C.signal : major ? (COMFORT ? (far ? C.z6 : C.z8) : C.z9) : (far ? C.z4 : C.z5),
    'stroke-width': major ? (COMFORT ? 2.5 : 3) : 1.5 });
  if (major) { const [tx, ty] = pt(A.cx, A.cy, 206, a); txt('tick', tx, ty + 9, v / 1000, 'middle', v >= A.max ? C.signal : far ? C.z6 : COMFORT ? C.z7 : null); }
}
el('path', { d: arc(A.cx, A.cy, 282, A.a0 - 8, A.a1 + 8), fill: 'none', stroke: C.z6, 'stroke-width': 2.5, 'stroke-linecap': 'round' });
/* the shift ladder, unlit (Sport) */
const L = G.ladder;
if (!COMFORT) for (let i = 0; i < L.n; i++) {
  const outer = L.from - i * (L.seg + L.gap);
  [[-outer, -outer + L.seg], [outer - L.seg, outer]].forEach(([a0, a1]) =>
    el('path', { d: arc(A.cx, A.cy, L.r, a0, a1), fill: 'none', stroke: C.z2, 'stroke-width': 9 }));
}
txt('meta', 960, 174, '×1000 rpm', 'middle', C.z6);
if (COMFORT) {
  txt('lbl', 923.4, 226, 'Set', 'start');
  txt('unit', 960, 424, 'mph');
  el('circle', { cx: 916, cy: 476, r: 24, fill: C.z10, stroke: C.signal, 'stroke-width': 6 });
  txt('cgear', G.cgear.x, G.cgear.y, 'D', 'start');
  txt('mode', 960, 567, 'COMFORT');
} else {
  txt('gm', G.gear.mx, G.gear.y, 'M', 'start');
  txt('unit', 960, 494, 'mph');
  txt('sport', 960, 567, 'SPORT');
}

/* ---------- left dial: power ---------- */
const P = G.power;
const pA = (hp) => P.a0 + (P.a1 - P.a0) * (Math.max(P.lo, Math.min(P.hi, hp)) - P.lo) / (P.hi - P.lo);
el('circle', { cx: P.cx, cy: P.cy, r: P.face, fill: 'url(#faceSm)' });
for (let r = P.grooves[0]; r <= P.grooves[1]; r += P.grooves[2]) {
  el('path', { d: arc(P.cx, P.cy, r, P0, P.a1), fill: 'none', stroke: COMFORT ? C.z8 : C.z10, 'stroke-width': COMFORT ? 1.4 : 1.5 });
  el('path', { d: arc(P.cx, P.cy, r, P.a0, P0), fill: 'none', stroke: C.electric, 'stroke-width': 1.6 });
}
if (COMFORT) el('path', { d: arc(P.cx, P.cy, 137, P0 + 2.5, pA(P.eco)), fill: 'none', stroke: C.eco, 'stroke-width': 2.5, 'stroke-linecap': 'round' });
for (let v = P.lo; v <= P.hi; v += COMFORT ? 20 : 50) {
  const a = pA(v), major = v % (COMFORT ? 60 : 100) === 0, zero = v === 0;
  const [x0, y0] = pt(P.cx, P.cy, zero ? (COMFORT ? 132 : 136) : major ? 168 : 171, a), [x1, y1] = pt(P.cx, P.cy, 176, a);
  el('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: zero ? C.z10 : v < 0 ? C.electric : major ? C.z8 : C.z5,
    'stroke-width': zero ? 2.5 : major ? 2.2 : 1.3 });
}
el('path', { d: arc(P.cx, P.cy, 184, P.a0 - 6, P.a1 + 6), fill: 'none', stroke: C.z7, 'stroke-width': 2.5, 'stroke-linecap': 'round' });
if (COMFORT) {
  txt('zone', 476, 238, 'Eco'); txt('zone', 326, 500, 'Charge'); txt('zone', 626, 500, 'Power');
  txt('unit', 476, 368, 'mpg average');
  el('circle', { cx: 393, cy: 406, r: 5, fill: C.electric });
  txt('row', 406, 412, 'Electric', 'start');
  txt('row', 406, 446, 'Trip', 'start');
} else {
  txt('unit', 476, 368, 'hp');
  el('circle', { cx: 401, cy: 406, r: 5, fill: C.z10 });
  txt('row', 414, 412, 'Engine', 'start');
  el('circle', { cx: 401, cy: 440, r: 5, fill: C.electric });
  txt('small', 270, 368, '0');
  txt('small', 326, 500, '−100', 'middle', C.electric);
  txt('small', 626, 500, '600');
}

/* ---------- right dial: tyres, a pit board ---------- */
const Y = G.tyres;
el('circle', { cx: Y.cx, cy: Y.cy, r: Y.face, fill: 'url(#faceSm)' });
el('path', { d: arc(Y.cx, Y.cy, 184, -141, 141), fill: 'none', stroke: C.z7, 'stroke-width': 2.5, 'stroke-linecap': 'round' });
if (COMFORT) {
  /* the map area: the car draws its own map there */
  const R = 160, cut = 372, dx = Math.sqrt(R * R - (cut - Y.cy) * (cut - Y.cy));
  el('path', { d: `M${(Y.cx - dx).toFixed(2)} ${cut}A${R} ${R} 0 1 1 ${(Y.cx + dx).toFixed(2)} ${cut}Z`, fill: C.z2, stroke: C.z4, 'stroke-width': 1 });
  txt('cap', Y.cx, 286, 'Map area');
  txt('cap', Y.cx, 306, 'the car draws its own map here');
} else for (const s of Y.slats) {
  const g = el('g', { transform: `translate(${s.x} ${s.y})` });
  el('rect', { x: 0, y: 0, width: 112, height: 80, rx: 3, fill: C.z2 }, g);
  el('line', { x1: 0, y1: 0.5, x2: 112, y2: 0.5, stroke: C.z4, 'stroke-width': 1 }, g);
  const c = txt('tc', 10, 21, s.id, 'start'); g.appendChild(c);
  el('rect', { x: 10, y: 70, width: 92, height: 3, rx: 1, fill: C.z4 }, g);
}
if (!COMFORT) txt('meta', 1444, 470, `Target ${GEOM.targetPsi[0]} front · ${GEOM.targetPsi[1]} rear psi`, 'middle');

/* ---------- outer columns ---------- */
const K = G.cols;
function cell(x, marks) {
  el('rect', { x: x - 13, y: 228, width: 26, height: 244, rx: 4, fill: 'none', stroke: C.z5, 'stroke-width': 1.5 });
  for (const m of marks) { const y = 468 - 236 * m.at; el('line', { x1: x + 17, y1: y, x2: x + 23, y2: y, stroke: m.c || C.z5, 'stroke-width': 1.5 }); }
}
const quarter = [{ at: .25 }, { at: .5 }, { at: .75 }];
const tN = (c) => (c - 40) / 120;
const tempMarks = [{ at: tN(80) }, { at: tN(120), c: C.caution }, { at: tN(140), c: C.signal }];
cell(K.fuel, [{ at: .12, c: C.caution }, ...quarter]);
cell(K.batt, [{ at: .15, c: C.caution }, ...quarter]);
cell(K.oil, tempMarks);
cell(K.cool, tempMarks);
[['Fuel', K.fuel], ['Battery', K.batt], ['Oil', K.oil], ['Coolant', K.cool]].forEach(([s, x]) => txt('lbl', x, 560, s));
const icon = (x, y, d, inner) => { const g = el('g', { transform: `translate(${x} ${y})`, fill: 'none', stroke: C.z7, 'stroke-width': 1.75,
  'stroke-linecap': 'round', 'stroke-linejoin': 'round' }); g.innerHTML = inner || ''; if (d) el('path', { d }, g); };
icon(121, 186, 'M2 20V3.5A1.5 1.5 0 0 1 3.5 2h8A1.5 1.5 0 0 1 13 3.5V20M0 20h15M4.5 6.5h6M13 9h2.2a1.3 1.3 0 0 1 1.3 1.3v6a1.5 1.5 0 0 0 3 0V7l-3-3');
icon(203, 189, 'M5 0v3M15 0v3M4.5 10h4M13 8v4M11 10h4', '<rect x="0" y="3" width="20" height="14" rx="2"/>');
icon(K.oil - 10, 189, 'M1 7h4l2-2h5l7 4-6 7H5l-2-4H1zM9 5V2M7 2h4M21 12.5c0 1.2-.8 2-1.5 2s-1.5-.8-1.5-2 1.5-3 1.5-3 1.5 1.8 1.5 3z');
icon(1778, 186, 'M8 3.5a2 2 0 0 1 4 0v9.2a3.8 3.8 0 1 1-4 0zM10 8v7M14 6h3M14 9.5h3M0 21c2-1.4 3.5-1.4 5 0s3 1.4 5 0 3-1.4 5 0 3 1.4 5 0');
</script>
</body>
