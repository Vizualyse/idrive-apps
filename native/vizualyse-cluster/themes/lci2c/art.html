     LCI inspired 2 · Comfort: everything that never moves, drawn as the Comfort
     mockup draws it (the lens and bands as in Sport, the limit disc, the boxes
     with D, labels, units, the meter's tracks and zones, the empty map panel).
     The moving parts are the theme's layers (theme.src.json, written by gen.js
     with geom.js). -->
<meta charset="utf-8">
<style>
@font-face{font-family:"Saira";src:url(../lci2/Saira-latin.woff2) format("woff2");font-weight:100 900;font-stretch:50% 125%;font-display:block}
:root{--ground:#000;--line:#27324a;--line-hi:#3c4a68;--ink:#eef3ff;--ink-2:#9aa8c4;--ink-3:#5c6984;--speed:#8fc4ff;--ok:#67dfa0;--num:"Saira",sans-serif}
html,body{margin:0;background:#000;width:1920px;height:646px;overflow:hidden}
svg{display:block;position:absolute;left:0;top:0;will-change:transform}
text{font-family:var(--num);font-variant-numeric:tabular-nums;fill:var(--ink)}
.lbl{font-size:13px;letter-spacing:.14em;font-weight:500;fill:var(--ink-2);font-stretch:100%}
.unit{font-size:15px;font-weight:400;fill:var(--ink-2);font-stretch:100%}
.scale{font-size:21px;font-weight:500;fill:#7482a0;font-stretch:87.5%}
.scale.on{fill:var(--ink)}
.scale.red{fill:#c0505b}
.scale.far{fill:#55617c}
.big{font-weight:600;font-stretch:87.5%;letter-spacing:-.01em}
.mid{font-weight:500;font-stretch:87.5%}
.sm{font-size:17px;font-weight:500;fill:var(--ink-2);letter-spacing:.08em}
.tag{font-size:17px;font-weight:600;letter-spacing:.2em;fill:#1d2536}
.zone{fill:#7482a0}
</style>
<script src="geom.js"></script>
<body>
<svg id="cl" width="1920" height="646" viewBox="0 0 1920 646">
  <defs>
    <linearGradient id="lensFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1322"/><stop offset="1" stop-color="#050911"/>
    </linearGradient>
    <pattern id="lines" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#7d9bd0" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="lensClip"><path d="M500 52 H1420 L1560 192 V440 L1420 580 H500 L360 440 V192 Z"/></clipPath>
  </defs>
  <rect width="1920" height="646" fill="var(--ground)"/>

  <!-- lens -->
  <path d="M500 52 H1420 L1560 192 V440 L1420 580 H500 L360 440 V192 Z" fill="url(#lensFill)"/>
  <rect width="1920" height="646" fill="url(#lines)" clip-path="url(#lensClip)"/>
  <path d="M503 58 H1417 L1554 195 V437 L1417 574 H503 L366 437 V195 Z" fill="none" stroke="#18223a" stroke-width="1"/>
  <path d="M500 52 H1420 L1560 192 V440 L1420 580 H500 L360 440 V192 Z" fill="none" stroke="var(--line-hi)" stroke-width="1.5"/>

  <!-- band tracks; fills, needles, numerals' lighting and the cruise mark are layers -->
  <path d="M650 604 H490 L336 450 V182 L490 28 H560" fill="none" stroke="#0f1a2c" stroke-width="12" stroke-linejoin="miter"/>
  <path d="M1270 604 H1430 L1584 450 V182 L1430 28 H1360" fill="none" stroke="#111827" stroke-width="12" stroke-linejoin="miter"/>
  <path id="rvRed" fill="none" stroke="#3a0f15" stroke-width="12" stroke-linejoin="miter"/>
  <g id="spScale"></g><g id="rvScale"></g>
  <text class="sm" x="1306" y="36" text-anchor="end">rpm ×1000</text>
  <text class="sm" x="622" y="36">mph</text>

  <!-- speed limit (its numeral is a layer) and cruise -->
  <circle cx="501" cy="146" r="26" fill="#f1f4fa" stroke="#e23542" stroke-width="7"/>
  <text class="lbl" x="551" y="134">CRUISE</text>
  <text class="lbl" x="1280" y="134">TRIP</text>

  <!-- speed box -->
  <path d="M410 196 H624 L640 212 V396 L624 412 H410 L394 396 V212 Z" fill="#02040a" fill-opacity=".85" stroke="var(--line)" stroke-width="1.5"/>
  <text class="unit" x="517" y="386" text-anchor="middle">mph</text>

  <!-- gear box: D and the unlit EV lamp here; the gear and the lit lamp are layers -->
  <path d="M1296 196 H1510 L1526 212 V396 L1510 412 H1296 L1280 396 V212 Z" fill="#02040a" fill-opacity=".85" stroke="var(--line)" stroke-width="1.5"/>
  <text class="tag" x="1403" y="252" text-anchor="middle">EV</text>
  <text id="dLetter" class="big" y="364" font-size="128">D</text>

  <!-- fuel -->
  <text class="lbl" x="472" y="466">FUEL</text>
  <text class="sm" x="472" y="512">E</text>
  <text class="sm" x="556" y="512" text-anchor="middle">½</text>
  <text class="sm" x="640" y="512" text-anchor="end">F</text>
  <text class="lbl" x="472" y="541">RANGE</text>

  <!-- coolant and tyres -->
  <text class="lbl" x="1280" y="466">COOLANT</text>
  <rect x="1280" y="480" width="168" height="8" fill="#141b29"/>
  <rect x="1343" y="480" width="63" height="8" fill="#16301f"/>
  <text class="sm" x="1280" y="512">50</text>
  <text class="sm" x="1364" y="512" text-anchor="middle">90</text>
  <text class="sm" x="1448" y="512" text-anchor="end">130</text>
  <text class="lbl" x="1280" y="541">TYRES psi</text>

  <!-- guidance labels -->
  <text class="lbl" x="948" y="122">TO GO</text>
  <text class="lbl" x="1208" y="122" text-anchor="end">ARRIVAL</text>

  <!-- the charge / eco / power meter's tracks -->
  <rect x="712" y="176" width="496" height="12" fill="#101828"/>
  <rect x="836" y="176" width="223" height="12" fill="#1f4d38"/>
  <line x1="836" y1="188.5" x2="1060" y2="188.5" stroke="var(--ok)" stroke-opacity=".35" stroke-width="1"/>
  <line x1="836" y1="172" x2="836" y2="198" stroke="var(--ink-2)" stroke-width="1.5"/>
  <line x1="712" y1="192" x2="712" y2="198" stroke="#3a4660" stroke-width="1.5"/>
  <line x1="1059" y1="192" x2="1059" y2="198" stroke="#3a4660" stroke-width="1.5"/>
  <line x1="1208" y1="192" x2="1208" y2="198" stroke="#3a4660" stroke-width="1.5"/>
  <text class="sm zone" x="712" y="216">CHARGE</text>
  <text class="sm zone" x="947" y="216" text-anchor="middle">ECO</text>
  <text class="sm zone" x="1208" y="216" text-anchor="end">POWER</text>

  <!-- map area: the car draws its own map here; an empty panel -->
  <path d="M728 240 H1192 L1208 256 V456 L1192 472 H728 L712 456 V256 Z" fill="#071020" stroke="var(--line)" stroke-width="1.5"/>

  <!-- bottom readouts -->
  <line x1="836" y1="500" x2="836" y2="556" stroke="var(--line)"/>
  <line x1="960" y1="500" x2="960" y2="556" stroke="var(--line)"/>
  <line x1="1084" y1="500" x2="1084" y2="556" stroke="var(--line)"/>
  <text class="lbl" x="712" y="512">BATTERY</text>
  <rect x="780" y="536" width="40" height="10" fill="none" stroke="var(--ink-3)" stroke-width="1.2"/>
  <rect x="820" y="539" width="3" height="4" fill="var(--ink-3)"/>
  <text class="lbl" x="852" y="512">E-RANGE</text>
  <text class="lbl" x="976" y="512">ECONOMY</text>
  <text class="lbl" x="1100" y="512">AVG SPEED</text>
  <g id="units"></g>

  <!-- outside the lens -->
  <text class="mid" x="1770" y="626" text-anchor="end" font-size="20" style="fill:var(--speed);letter-spacing:.16em">COMFORT</text>
</svg>
<script>
'use strict';
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const mk = (tag, attrs, parent, txt) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (txt != null) e.textContent = txt; if (parent) parent.appendChild(e); return e; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const G = window.LCI;

function band(pts, side) {
  const segs = []; let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
    const len = Math.hypot(x1 - x0, y1 - y0); segs.push({ x0, y0, x1, y1, len, start: total }); total += len;
  }
  return (f) => {
    const d = clamp(f, 0, 1) * total;
    let s = segs[segs.length - 1];
    for (const g of segs) if (d <= g.start + g.len) { s = g; break; }
    const t = (d - s.start) / s.len, dx = (s.x1 - s.x0) / s.len, dy = (s.y1 - s.y0) / s.len;
    const n = side < 0 ? [dy, -dx] : [-dy, dx];
    return { x: lerp(s.x0, s.x1, t), y: lerp(s.y0, s.y1, t), nx: n[0], ny: n[1] };
  };
}
const spAt = band([[650, 604], [490, 604], [336, 450], [336, 182], [490, 28], [560, 28]], -1);
const rvAt = band([[1270, 604], [1430, 604], [1584, 450], [1584, 182], [1430, 28], [1360, 28]], 1);

const SPD = [0, 20, 40, 60, 80, 100, 130, 160, 200];
const spFrac = (v) => { v = clamp(v, 0, 200); for (let i = 1; i < SPD.length; i++) if (v <= SPD[i]) return (i - 1 + (v - SPD[i - 1]) / (SPD[i] - SPD[i - 1])) / 8; return 1; };
SPD.forEach((v, i) => {
  const p = spAt(i / 8), off = 30, end = i === 8;
  mk('text', { class: 'scale' + (v === 0 ? ' on' : ''), x: (end ? p.x + 14 : p.x + p.nx * off).toFixed(1), y: (end ? p.y + 8 : p.y + p.ny * off + 7).toFixed(1), 'text-anchor': end ? 'start' : p.nx < -0.3 ? 'end' : 'middle' }, $('spScale'), v);
});
for (let v = 10; v < 200; v += 10) { if (SPD.includes(v)) continue; const p = spAt(spFrac(v)); mk('line', { x1: p.x + p.nx * 9, y1: p.y + p.ny * 9, x2: p.x + p.nx * 13, y2: p.y + p.ny * 13, stroke: '#3a4660', 'stroke-width': 1.5 }, $('spScale')); }

/* rev scale: numerals above 4 sit back, as do their half ticks */
const RED = 6800, MAXR = 8000;
for (let k = 0; k <= 8; k++) {
  const p = rvAt(k / 8), off = 30, end = k === 8;
  mk('text', { class: 'scale' + (k >= 7 ? ' red' : k > 4 ? ' far' : '') + (k === 0 ? ' on' : ''), x: (end ? p.x - 14 : p.x + p.nx * off).toFixed(1), y: (end ? p.y + 8 : p.y + p.ny * off + 7).toFixed(1), 'text-anchor': end ? 'end' : p.nx > 0.3 ? 'start' : 'middle' }, $('rvScale'), k);
}
for (let r = 500; r < MAXR; r += 500) { if (r % 1000 === 0) continue; const p = rvAt(r / MAXR); mk('line', { x1: p.x + p.nx * 9, y1: p.y + p.ny * 9, x2: p.x + p.nx * 13, y2: p.y + p.ny * 13, stroke: r > 4000 ? '#263047' : '#3a4660', 'stroke-width': 1.5 }, $('rvScale')); }
{ const pts = []; for (let f = RED / MAXR; f <= 1.0001; f += 0.005) { const p = rvAt(f); pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1)); } $('rvRed').setAttribute('d', 'M' + pts.join(' L')); }

$('dLetter').setAttribute('x', G.dX);

const U = G.U, u = $('units');
[['mph', U.setU, 168], ['mi', U.tripU, 168], ['mi', U.togoU, 160], ['mi', U.rangeU, 542], ['%', U.socU, 548], ['mi', U.erU, 548], ['mpg', U.mpgU, 548], ['mph', U.avgU, 548]]
  .forEach(([s, x, y]) => mk('text', { class: 'unit', x, y }, u, s));
</script>
</body>
