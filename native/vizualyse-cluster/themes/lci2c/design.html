     as a design (DESIGNS.md), on the Sport theme's taller lens and bands
     (themes/lci2/design.html) for the whole 1920 x 720 panel: the map panel
     takes the room the lens gained, the clock, outside temperature, odometer
     and COMFORT become an info line in the old bottom strip. Nothing
     important in the top 40 px.
     Calm: speed on the left band with the cruise set speed marked, revs in
     pale grey, the speed limit and cruise above the speed box, D + gear with
     an EV lamp, the next turn, distance to go and arrival over a centre-zero
     CHARGE / ECO / POWER meter, the map panel (the theme's map slot),
     battery, e-range, economy, average speed, fuel, coolant and tyres.
     Nothing flashes. UK units: mph, miles, psi, degrees C, mpg.
     Build (after themes/lci2): node tools/design_build.js themes/lci2c -->
<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="lci2c">
<meta name="theme-title" content="LCI inspired 2 · Comfort">
<meta name="theme-family" content="lci2">
<meta name="theme-mode" content="comfort">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="40">

<!-- shared values the bindings use -->
<meta name="let:mphS" content="smooth(mph(kmh), 10)">
<meta name="let:rpmS" content="smooth(rpm, 8)">
<meta name="let:setMph" content="mph(cruiseKmh)">
<!-- the meter: px right of zero for the engine (ew) and the motor (lw), left of it for regen -->
<meta name="let:ew" content="when(ok(engineHp), round(clamp(max(0, engineHp) / P.maxHp) * P.pos), 0)">
<meta name="let:lw" content="when(elecHp > 0, min(round(clamp(elecHp / P.maxHp) * P.pos), P.pos - ew), 0)">
<meta name="let:rgPx" content="when(elecHp &lt; 0, clamp(-elecHp / P.negHp) * P.neg, 0)">
<meta name="let:rgCells" content="round(rgPx / 5.9)">
<meta name="let:turnMi" content="turnM / 1609.344">
<script type="application/json" id="theme-params">
{ "maxRpm": 8000, "redRpm": 6800, "maxHp": 300, "negHp": 100, "pos": 372, "neg": 124, "ecoEnd": 223,
  "zoneE": 216, "zoneP": 426, "turnX": 764, "turnGap": 6, "turnAdv": { "d": 22, ".": 9, "-": 13 } }
</script>

<style>
/* Saira (SIL Open Font License, ../lci2/OFL.txt): the semi-condensed instance
 * (87.5% width) for numerals, the variable font at normal width for labels and units */
@font-face { font-family: "Saira SC"; font-weight: 100 900; src: url(../lci2/SairaSemiCondensed.woff2) format("woff2"); }
@font-face { font-family: "Saira"; font-weight: 100 900; font-stretch: 50% 125%; src: url(../lci2/Saira-latin.woff2) format("woff2"); }
:root {
  --ground: #000000; --line: #27324a; --line-hi: #3c4a68;
  --ink: #eef3ff; --ink-2: #9aa8c4; --ink-3: #5c6984; --speed: #8fc4ff; --calm: #c9d8f2;
  --red: #ff2e3e; --elec: #2fd0ff; --ok: #67dfa0; --warm: #ffb02e;
  --track: #141b29; --box: #03050b; --sign-ink: #0a0e18;
}
html, body { margin: 0; background: #000; }
svg { display: block; }
svg text { font-family: "Saira SC", sans-serif; font-variant-numeric: tabular-nums; fill: var(--ink); }
.lbl { font-family: "Saira", sans-serif; font-size: 13px; letter-spacing: .14em; font-weight: 500; fill: var(--ink-2); }
.unit { font-family: "Saira", sans-serif; font-size: 15px; font-weight: 400; fill: var(--ink-2); }
.scale { font-size: 21px; font-weight: 500; fill: #7482a0; }
.scale.zero { fill: var(--ink); }
.scale.far { fill: #55617c; }
.scale.red { fill: #c0505b; }
.big { font-weight: 600; letter-spacing: -.01em; }
.mid { font-weight: 500; }
.sm { font-family: "Saira", sans-serif; font-size: 17px; font-weight: 500; fill: var(--ink-2); letter-spacing: .08em; }
.zone { fill: #7482a0; }
</style>
</head>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function mk(tag, attrs, parent) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  var P = JSON.parse($('theme-params').textContent);

  /* the mockup's band helper: point + outward normal at a fraction of the band */
  function band(pts, side) {
    var segs = [], total = 0;
    for (var i = 1; i < pts.length; i++) {
      var x0 = pts[i - 1][0], y0 = pts[i - 1][1], x1 = pts[i][0], y1 = pts[i][1], len = Math.hypot(x1 - x0, y1 - y0);
      segs.push({ x0: x0, y0: y0, x1: x1, y1: y1, len: len, start: total }); total += len;
    }
    return function (f) {
      var d = clamp(f, 0, 1) * total, s = segs[segs.length - 1];
      for (var j = 0; j < segs.length; j++) if (d <= segs[j].start + segs[j].len) { s = segs[j]; break; }
      var t = (d - s.start) / s.len, dx = (s.x1 - s.x0) / s.len, dy = (s.y1 - s.y0) / s.len;
      var n = side < 0 ? [dy, -dx] : [-dy, dx];
      return { x: lerp(s.x0, s.x1, t), y: lerp(s.y0, s.y1, t), nx: n[0], ny: n[1] };
    };
  }
  var spAt = band([[650, 660], [490, 660], [336, 506], [336, 208], [490, 54], [560, 54]], -1);
  var rvAt = band([[1270, 660], [1430, 660], [1584, 506], [1584, 208], [1430, 54], [1360, 54]], 1);

  /* speed scale: as Sport */
  var SPD = [0, 20, 40, 60, 80, 100, 130, 160, 200];
  function spFrac(v) { v = clamp(v, 0, 200); for (var i = 1; i < SPD.length; i++) if (v <= SPD[i]) return (i - 1 + (v - SPD[i - 1]) / (SPD[i] - SPD[i - 1])) / 8; return 1; }
  SPD.forEach(function (v, i) {
    var p = spAt(i / 8), end = i === 8;
    var t = mk('text', { 'class': 'scale' + (v === 0 ? ' zero' : ''), x: (end ? p.x + 14 : p.x + p.nx * 30).toFixed(1), y: (end ? p.y + 10 : p.y + p.ny * 30 + 7).toFixed(1),
      'text-anchor': end ? 'start' : p.nx < -0.3 ? 'end' : 'middle' }, $('spScale'));
    t.textContent = v;
  });
  for (var v = 10; v < 200; v += 10) {
    if (SPD.indexOf(v) >= 0) continue;
    var p = spAt(spFrac(v));
    mk('line', { x1: p.x + p.nx * 9, y1: p.y + p.ny * 9, x2: p.x + p.nx * 13, y2: p.y + p.ny * 13, stroke: '#3a4660', 'stroke-width': 1.5 }, $('spScale'));
  }

  /* rev scale 0-8, the redline from 6800; numerals above 4 sit back in Comfort */
  var MAXR = P.maxRpm;
  for (var k = 0; k <= 8; k++) {
    var q = rvAt(k / 8), e8 = k === 8;
    var tt = mk('text', { 'class': 'scale' + (k >= 7 ? ' red' : k > 4 ? ' far' : k === 0 ? ' zero' : ''), x: (e8 ? q.x - 14 : q.x + q.nx * 30).toFixed(1), y: (e8 ? q.y + 10 : q.y + q.ny * 30 + 7).toFixed(1),
      'text-anchor': e8 ? 'end' : q.nx > 0.3 ? 'start' : 'middle' }, $('rvScale'));
    tt.textContent = k;
  }
  for (var r = 500; r < MAXR; r += 500) {
    if (r % 1000 === 0) continue;
    var m = rvAt(r / MAXR);
    mk('line', { x1: m.x + m.nx * 9, y1: m.y + m.ny * 9, x2: m.x + m.nx * 13, y2: m.y + m.ny * 13, stroke: r > 4000 ? '#263047' : '#3a4660', 'stroke-width': 1.5 }, $('rvScale'));
  }
  var red = [];
  for (var f = P.redRpm / MAXR; f <= 1.0001; f += 0.005) { var a = rvAt(f); red.push(a.x.toFixed(1) + ',' + a.y.toFixed(1)); }
  $('rvRed').setAttribute('d', 'M' + red.join(' L'));

  /* fuel segments, unlit */
  for (var j = 0; j < 10; j++) mk('rect', { x: 472 + j * 17, y: 528, width: 14, height: 8, fill: '#141b29' }, $('fuelSegs'));
})();
</script>
