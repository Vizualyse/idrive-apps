     lci1 "LCI inspired 1": the static art of the LCI Sport mockup (its SVG,
     geometry and colours), without what moves. The lit bands, tints, traces,
     needles, shift lights, bars, tyres, the g dot and every reading are the
     theme's layers (theme.src.json, written by gen.js). A value tspan kept
     here with fill-opacity 0 only holds its unit where the mockup puts it;
     gen.js reads those positions with #measure.
     Scale numerals are drawn dim: the numerals layer brightens the ones
     the band has reached. -->
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; src: url(fonts/Archivo.woff2) format("woff2"); }
html, body { margin: 0; background: #000; }
svg { display: block; }
text { font-family: "Archivo", sans-serif; fill: #f5f8ff; font-variant-numeric: tabular-nums lining-nums; }
.big   { font-size: 112px; font-weight: 600; font-stretch: 108%; letter-spacing: -0.02em; }
.val   { font-size: 44px; font-weight: 600; font-stretch: 108%; }
.val-s { font-size: 24px; font-weight: 600; font-stretch: 108%; }
.unit  { font-size: 18px; font-weight: 500; fill: #b4c8ff; }
.lab   { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; fill: #b4c8ff; }
.sub   { font-size: 22px; font-weight: 500; fill: #b4c8ff; }
.scale { font-size: 30px; font-weight: 500; font-stretch: 108%; fill: #7f8fb8; }
.corner { font-size: 20px; font-weight: 500; fill: #7f8fb8; }
.clock  { font-size: 32px; font-weight: 500; font-stretch: 108%; }
.hid { fill-opacity: 0; }
.ico path { fill: none; stroke: #b4c8ff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
#out { position: absolute; left: 0; top: 0; color: #fff; font: 10px monospace; white-space: pre; }
</style>

  <g id="iBat" class="ico"><path d="M2,8 h20 v12 h-20 z M6,8 V5 h4 v3 M14,8 V5 h4 v3 M5.5,14 h5 M13.5,14 h5 M16,11.5 v5"/></g><text id="wBat"><tspan id="mBat" class="val-s hid">64</tspan><tspan class="unit" dx="4">%</tspan></text><text class="sub hid" id="sBat">21 mi</text>

</svg>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  /* the mockup's own builders, unchanged in geometry */
  var K = 178 / 290, NX = 0.8523, NY = 0.5231;
  function edgePt(f, side) {
    var y = 610 - f * 580, dx = 178 - Math.abs(y - 320) * K;
    return { x: side < 0 ? 430 - dx : 1490 + dx, y: y, upper: f > 0.5 };
  }
  var numerals = [];
  function buildScale(g, side, majors, minors, toF) {
    minors.concat(majors).forEach(function (v, i) {
      var major = i >= minors.length;
      if (!major && majors.indexOf(v) >= 0) return;
      var p = edgePt(toF(v), side), f = toF(v);
      var nx = side * NX, ny = f === 0.5 ? 0 : (p.upper ? -NY : NY);
      if (f === 0.5) nx = side;
      var a = 5, b = major ? 20 : 12;
      el('line', { x1: p.x + nx * a, y1: p.y + ny * a, x2: p.x + nx * b, y2: p.y + ny * b,
        stroke: major ? '#b4c8ff' : '#56648c', 'stroke-width': major ? 2.5 : 1.5 }, g);
      if (major) {
        var t = el('text', { 'class': 'scale', x: p.x + side * 34, y: p.y + 10, 'text-anchor': side < 0 ? 'end' : 'start' }, g);
        t.textContent = v >= 1000 ? v / 1000 : v;
        numerals.push({ side: side, v: v, t: t, y: p.y + 10 });
      }
    });
  }
  var i, mM = [], mm = [], rM = [], rm = [];
  for (i = 0; i <= 180; i += 20) mM.push(i);
  for (i = 0; i <= 180; i += 10) mm.push(i);
  for (i = 0; i <= 7000; i += 1000) rM.push(i);
  for (i = 0; i <= 7000; i += 500) rm.push(i);
  buildScale($('scaleL'), -1, mM, mm, function (v) { return v / 180; });
  buildScale($('scaleR'), 1, rM, rm, function (v) { return v / 7000; });

  var Y0 = 590, Y1 = 424;
  function barX(y, side, off) {
    var edge = side < 0 ? 252 + (y - 320) * K : 1668 - (y - 320) * K;
    return edge + (side < 0 ? off : -off - 10);
  }
  function barPts(side, off, ya, yb) {
    var xa = barX(ya, side, off), xb = barX(yb, side, off);
    return xa + ',' + ya + ' ' + (xa + 10) + ',' + ya + ' ' + (xb + 10) + ',' + yb + ' ' + xb + ',' + yb;
  }
  function makeBar(side, off, track, warnFrom, warnCol) {
    var g = $('bars');
    el('polygon', { points: barPts(side, off, Y0, Y1), fill: track }, g);
    if (warnFrom != null) {
      var yw = Y0 - warnFrom * (Y0 - Y1);
      el('polygon', { points: warnFrom > 0.5 ? barPts(side, off, yw, Y1) : barPts(side, off, Y0, yw), fill: warnCol, opacity: 0.45 }, g);
    }
  }
  makeBar(-1, 92, '#0a1d6a', 0.12, '#ffb224');
  makeBar(-1, 216, '#0a1d6a', null);
  makeBar(1, 92, '#0a1d6a', 0.82, '#ff2a45');
  makeBar(1, 216, '#0a1d6a', 0.82, '#ff2a45');
  function place(id, side, off, y) {
    var x = barX(y, side, off) + (side < 0 ? 26 : -16);
    $(id).setAttribute('x', x); $(id).setAttribute('y', y);
  }
  function icon(id, side, off) {
    var x = barX(440, side, off) + (side < 0 ? 26 : -16 - 24);
    $(id).setAttribute('transform', 'translate(' + x.toFixed(1) + ' 430)');
  }
  icon('iFuel', -1, 92); place('wFuel', -1, 92, 490); place('sFuel', -1, 92, 518);
  icon('iBat', -1, 216); place('wBat', -1, 216, 490); place('sBat', -1, 216, 518);
  icon('iOil', 1, 92); place('wOil', 1, 92, 490);
  icon('iCool', 1, 216); place('wCool', 1, 216, 490);

  /* #measure: where the mockup puts each reading, for gen.js */
  if (location.hash !== '#measure') return;
  document.fonts.ready.then(function () {
    var out = { spans: {}, numerals: [] };
    ['mEng', 'mEle', 'mEleUnit', 'mSysN', 'mPFL', 'mPFR', 'mPRL', 'mPRR', 'mBoost', 'mG', 'mM', 'mGear', 'mFuel', 'mBat', 'mOil', 'mCool'].forEach(function (id) {
      var e = $(id), n = e.textContent.length;
      var a = e.getStartPositionOfChar(0), b = e.getEndPositionOfChar(n - 1), bb = e.getBBox();
      out.spans[id] = { x0: a.x, x1: b.x, y: a.y, bx: bb.x, bw: bb.width };
    });
    ['mSys', 'sFuel', 'sBat'].forEach(function (id) {
      var e = $(id), n = e.textContent.length;
      out.spans[id] = { x0: e.getStartPositionOfChar(0).x, x1: e.getEndPositionOfChar(n - 1).x, y: e.getStartPositionOfChar(0).y };
    });
    numerals.forEach(function (n) {
      var b = n.t.getBBox();
      out.numerals.push({ side: n.side, v: n.v, x: b.x, w: b.width, y: n.y });
    });
    var pre = document.createElement('div'); pre.id = 'out';
    pre.textContent = 'MEASURE' + JSON.stringify(out) + 'END';
    document.body.appendChild(pre);
  });
})();
</script>
