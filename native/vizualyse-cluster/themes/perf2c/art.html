<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="perf2c">
<meta name="theme-title" content="Performance 2 · Comfort">
<meta name="theme-family" content="perf2">
<meta name="theme-mode" content="comfort">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="8">

<!-- shared values: the needles (the rev needle glides, as the mockup's), the engine off, the lowest tyre -->
<meta name="let:vMph" content="smooth(mph(kmh), 12)">
<meta name="let:vRpm" content="smooth(rpm, 6)">
<meta name="let:engineOff" content="ok(rpm) && rpm < 100">
<meta name="let:tyreMin" content="min(tyres[0].bar, tyres[1].bar, tyres[2].bar, tyres[3].bar)">
<script type="application/json" id="theme-params">
{ "maxMph": 180, "maxRpm": 8000, "redRpm": 7000, "quietRpm": 4000, "fuelLowPct": 15, "tyreLowBar": 2.1,
  "dialLen": 1300.62, "demandHp": 250, "eco": 0.45, "arrowX": 747, "arrowFlipDx": -6,
  "bars": { "len": 695, "dMin": -0.5, "dMax": 1, "dT1": 0.74820 },
  "cool": { "lo": 50, "hi": 130, "w": 150 } }
</script>

<style>
@font-face { font-family: "Cluster"; font-weight: 500; src: url(../fonts/BarlowSemiCondensed-500.woff2) format("woff2"); }
@font-face { font-family: "Cluster"; font-weight: 600; src: url(../fonts/BarlowSemiCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Cluster"; font-weight: 700; src: url(../perf2/BarlowSemiCondensed-700.woff2) format("woff2"); }
:root {
  --ground: #04060a; --ink: #eef2f6; --ink-2: #9ba6b2; --ink-3: #7a8592; --well: #0d1218;
  --red: #ff3b2f; --amber: #ffb224; --blue: #3f9cff; --cool: #d9e6f2;
  --track: #18202a; --track-dim: #121820; --glow: #121417; --sign-ink: #0a0d12; --sign-red: #d6362b; --map: #090e15;
  --hair: rgba(196,214,232,.10); --hair-2: rgba(196,214,232,.18);
}
html, body { margin: 0; width: 1920px; height: 720px; overflow: hidden; background: #000; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 720px;
  background:
    radial-gradient(460px 425px at 442px 380px, #0b1118 0%, rgba(11,17,24,0) 70%),
    radial-gradient(460px 425px at 1478px 380px, #0b1118 0%, rgba(11,17,24,0) 70%),
    radial-gradient(640px 500px at 960px 400px, #080c12 0%, rgba(8,12,18,0) 75%),
    var(--ground); }
svg { position: absolute; left: 0; top: 0; display: block; }
svg text { font-family: "Cluster", sans-serif; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.lbl { font-size: 18px; letter-spacing: 2.52px; fill: var(--ink-2); }
.unit { font-weight: 500; fill: var(--ink-2); }
.v40 { font-size: 40px; } .v26 { font-size: 26px; } .t20 { font-size: 20px; }
.status { font-size: 16px; font-weight: 700; letter-spacing: 2.24px; fill: var(--ink-3); }
.hr { fill: var(--hair); }
.seg { fill: var(--track); }
</style>
<style data-design-build>[data-gauge]:not([data-keep]), [data-gauge]:not([data-keep]) *,
[data-text], [data-text] *,
[data-leds], [data-leds] *,
[data-rect], [data-rect] *,
[data-guide], [data-guide] *,
[data-sprite], [data-sprite] * { visibility: hidden !important; }</style>
<!-- generated by tools/design_build.js from design.html: edit the design, not this -->
</head>
<body>
<div id="stage"></div>

  <rect data-guide x="0" y="0" width="1920" height="8" fill="url(#hatch)" opacity="0.5"/>

  <g id="dialS"></g>
  <g id="dialT"></g>

        data-value="max(0, vRpm) / P.maxRpm"
        data-band="-6 6" data-band-color="alpha(C.cool, 0.2)" data-red="0.5" data-red-color="alpha(C.cool, 0.7)"
        data-needle="-12 46 6 2.4" data-needle-color="C.ink"
        data-glow="92 600 0.6" data-glow-color="C.glow" data-pool="40 0 0" data-look="0.25 1.6 1"/>

  <text class="unit" x="819.6" y="49" style="font-size:30px">°C</text>
  <text x="878" y="47" style="font-size:24px;font-weight:700;letter-spacing:4.8px">COMFORT</text>

  <text x="1497" y="482" text-anchor="end" style="font-size:30px" data-text="rpmText" data-color="when(engineOff, C.ink2, C.ink)"

  <rect x="1500" y="678" width="150" height="6" rx="1" class="seg"/>
  <rect x="1556.25" y="678" width="46.88" height="6" style="fill:rgba(196,214,232,.22)"/>
  <rect x="1498.5" y="674" width="3" height="14" rx="1" style="fill:var(--ink)" data-rect="coolMark" data-rate="10"

  <text class="unit" x="1200" y="152" style="font-size:20px">%</text>

            data-gauge="arrowTurn" data-ends data-art="off" data-value="1" data-band="-3.5 3.5"

  <text class="t20" x="754" y="428" style="fill:var(--ink-2)" data-text="distUnit" data-dx="0" data-rate="10"

  <text class="t20" x="748" y="466" data-text="roadText" data-rate="10"

  <text class="t20" x="748" y="534" data-text="etaText" data-rate="10"

  <!-- the map panel: the theme's map slot (the car draws its own map here) -->
  <rect x="900.5" y="266.5" width="275" height="309" rx="3" style="fill:var(--map);stroke:var(--hair-2);stroke-width:1"/>
  <text data-guide x="914" y="562" style="font-size:14px;letter-spacing:1.96px;fill:var(--ink-3)">MAP AREA · THE CAR'S OWN MAP</text>
  <rect data-map x="900" y="266" width="276" height="310" rx="3" fill="none"/>
  <rect class="hr" x="700" y="592" width="520" height="1"/>

  <text class="status" x="1220" y="619" text-anchor="end" data-text="hvState" data-rate="10"
        data-text-expr="when(!ok(elecHp) &amp;&amp; !ok(rpm), '--', when(elecHp &lt; -0.5, 'CHARGING', when(engineOff, 'ELECTRIC', 'HYBRID')))"
        data-color="when(elecHp &lt; -0.5 || engineOff, C.blue, C.ink3)">CHARGING</text>
  <text x="764" y="655" text-anchor="end" style="font-size:44px" data-text="hvText" data-text-expr="fmt(socPct)" data-rate="10">100</text>
  <text class="unit" x="768" y="655" style="font-size:22px">%</text>
  <text x="836" y="655" text-anchor="end" style="font-size:30px" data-text="evRangeText" data-text-expr="fmt(miles(evRangeKm))" data-rate="10">88</text>
  <text class="unit" x="842" y="655" style="font-size:18px">mi electric</text>
  <g id="hvBar" data-leds="hv" data-count="24" data-light="8 9" data-radius="1" data-c0="C.blue" data-off="C.track"

    <rect x="950" y="636" width="270" height="9" fill="none"/>

  <!-- the trip in the strip, between the bottom-left lights and the gear window -->
  <text class="lbl" x="934" y="703">TRIP</text>
  <text x="1104" y="705" text-anchor="end" style="font-size:44px" data-text="tripText" data-text-expr="fmt(miles(tripKm), 1)" data-rate="10">888.8</text>
  <text class="unit" x="1110" y="705" style="font-size:22px">mi</text>
  <text class="status" x="1310" y="703" text-anchor="end" style="fill:var(--ink-2)" data-text="avgText" data-rate="10"
        data-text-expr="'AVG ' + fmt(mph(avgKmh)) + ' MPH'">AVG 188 MPH</text>
</svg>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    parent.appendChild(n);
    return n;
  }
  var R = 276, A0 = 135, SWEEP = 270, D = Math.PI / 180;
  var SPD = [442, 380], TAC = [1478, 380];
  function ang(f) { return A0 + SWEEP * Math.min(1, Math.max(0, f)); }
  function pt(c, a, r) { return [c[0] + Math.cos(a * D) * r, c[1] + Math.sin(a * D) * r]; }
  function arcD(c, r, a1, a2) {
    var p = pt(c, a1, r), q = pt(c, a2, r);
    return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (a2 - a1 > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2);
  }
  function arc(g, c, r, a1, a2, w, col) { el('path', { d: arcD(c, r, a1, a2), fill: 'none', stroke: col, 'stroke-width': w }, g); }
  function tick(g, c, a, r1, r2, w, col) {
    var p = pt(c, a, r1), q = pt(c, a, r2);
    el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, 'stroke-width': w, 'stroke-linecap': 'butt' }, g);
  }
  /* the mockup's drawDial + drawScale (dim) + drawNumerals (dim), Comfort's quieter red zone and rev scale */
  function dial(g, c, o) {
    arc(g, c, R + 18, A0, A0 + SWEEP, 1.25, 'rgba(196,214,232,.16)');
    arc(g, c, R, A0, A0 + SWEEP, 12, '#0d1218');
    arc(g, c, R - 96, A0, A0 + SWEEP, 1, 'rgba(196,214,232,.06)');
    if (o.red) {
      arc(g, c, R, ang(o.red / o.max), ang(1), 12, 'rgba(184,24,15,.38)');
      arc(g, c, R + 18, ang(o.red / o.max), ang(1), 2, 'rgba(255,59,47,.8)');
    }
    for (var v = 0; v <= o.max + 1e-6; v += o.minor) {
      var a = ang(v / o.max), major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6, inRed = o.red && v >= o.red;
      var far = o.quiet && v > o.quiet && !inRed;
      if (major) tick(g, c, a, R - 34, R - 8, 3, inRed ? 'rgba(255,59,47,.8)' : far ? '#5a646f' : '#8f9aa6');
      else tick(g, c, a, R - 20, R - 8, 1.5, inRed ? 'rgba(255,59,47,.5)' : far ? '#343d47' : '#4a5460');
    }
    for (var w = 0; w <= o.max + 1e-6; w += o.label) {
      var b = ang(w / o.max), p = pt(c, b, R - 64), red = o.red && w >= o.red;
      el('text', { x: p[0], y: p[1] + 1 + 0.4 * 30, 'text-anchor': 'middle',
        style: 'font-size:30px;fill:' + (red ? 'rgba(255,59,47,.85)' : o.quiet && w > o.quiet ? '#69737e' : '#9aa5b1') }, g, o.fmt(w));
    }
  }
  var P = JSON.parse(document.getElementById('theme-params').textContent);
  dial(document.getElementById('dialS'), SPD, { max: P.maxMph, major: 20, minor: 5, label: 20, fmt: String });
  dial(document.getElementById('dialT'), TAC, { max: P.maxRpm, major: 1000, minor: 250, label: 1000, red: P.redRpm, quiet: P.quietRpm,
    fmt: function (v) { return String(v / 1000); } });
  el('text', { x: TAC[0], y: TAC[1] - R + 96, 'text-anchor': 'middle', style: 'font-size:17px;letter-spacing:2px;fill:#7a8592' },
    document.getElementById('dialT'), '× 1000');
  ['speedArc', 'cruiseArc'].forEach(function (id) { document.getElementById(id).setAttribute('d', arcD(SPD, R, A0, A0 + SWEEP)); });
  document.getElementById('tachArc').setAttribute('d', arcD(TAC, R, A0, A0 + SWEEP));

  /* the design's view of what the layers draw (hidden in the art) */
  [['fuelBar', 24, 302, 613, 280, 11, 11, '#d9e6f2', 8.17], ['hvBar', 24, 950, 636, 270, 9, 17, '#3f9cff', 8]].forEach(function (b) {
    var g = document.getElementById(b[0]), cw = b[4] / b[1];
    for (var j = 0; j < b[1]; j++) el('rect', { x: b[2] + j * cw + (cw - b[8]) / 2, y: b[3], width: b[8], height: b[5], rx: 1, style: 'fill:' + (j < b[6] ? b[7] : '#18202a') }, g);
  });
})();
</script>
</body>
</html>
