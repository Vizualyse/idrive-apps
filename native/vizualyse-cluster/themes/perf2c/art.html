<style>

@font-face { font-family: "Cluster"; font-weight: 600; src: url(../fonts/BarlowSemiCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Cluster"; font-weight: 700; src: url(../perf2/BarlowSemiCondensed-700.woff2) format("woff2"); }
:root {
  --ground: #04060a; --ink: #eef2f6; --ink-2: #9ba6b2; --ink-3: #7a8592; --well: #0d1218;

}
html, body { margin: 0; width: 1920px; height: 720px; overflow: hidden; background: #000; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 720px;

    radial-gradient(410px 380px at 1580px 336px, #0b1118 0%, rgba(11,17,24,0) 70%),
    radial-gradient(700px 470px at 960px 380px, #080c12 0%, rgba(8,12,18,0) 75%),

svg { position: absolute; left: 0; top: 0; display: block; }
svg text { font-family: "Cluster", sans-serif; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.lbl { font-size: 18px; letter-spacing: 2.52px; fill: var(--ink-2); }
.unit { font-weight: 500; fill: var(--ink-2); }
.v40 { font-size: 40px; } .v26 { font-size: 26px; } .t20 { font-size: 20px; }
.status { font-size: 16px; font-weight: 700; letter-spacing: 2.24px; fill: var(--ink-3); }
.hr { fill: var(--hair); }
.seg { fill: var(--track); }

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    parent.appendChild(n);
    return n;
  }
  var R = 250, A0 = 135, SWEEP = 270, D = Math.PI / 180;
  var SPD = [340, 336], TAC = [1580, 336];
  function ang(f) { return A0 + SWEEP * Math.min(1, Math.max(0, f)); }
  function pt(c, a, r) { return [c[0] + Math.cos(a * D) * r, c[1] + Math.sin(a * D) * r]; }
  function arcD(c, r, a1, a2) {
    var p = pt(c, a1, r), q = pt(c, a2, r);
    return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (a2 - a1 > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2);
  }
  function arc(g, c, r, a1, a2, w, col) { el('path', { d: arcD(c, r, a1, a2), fill: 'none', stroke: col, 'stroke-width': w }, g); }
  function tick(g, c, a, r1, r2, w, col) {
    var p = pt(c, a, r1), q = pt(c, a, r2);
    el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, 'stroke-width': w, 'stroke-linecap': 'butt' }, g);
  }
  /* the mockup's drawDial + drawScale (dim) + drawNumerals (dim), Comfort's quieter red zone and rev scale */
  function dial(g, c, o) {
    arc(g, c, R + 18, A0, A0 + SWEEP, 1.25, 'rgba(196,214,232,.16)');
    arc(g, c, R, A0, A0 + SWEEP, 12, '#0d1218');
    arc(g, c, R - 96, A0, A0 + SWEEP, 1, 'rgba(196,214,232,.06)');
    if (o.red) {
      arc(g, c, R, ang(o.red / o.max), ang(1), 12, 'rgba(184,24,15,.38)');
      arc(g, c, R + 18, ang(o.red / o.max), ang(1), 2, 'rgba(255,59,47,.8)');
    }
    for (var v = 0; v <= o.max + 1e-6; v += o.minor) {
      var a = ang(v / o.max), major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6, inRed = o.red && v >= o.red;
      var far = o.quiet && v > o.quiet && !inRed;
      if (major) tick(g, c, a, R - 34, R - 8, 3, inRed ? 'rgba(255,59,47,.8)' : far ? '#5a646f' : '#8f9aa6');
      else tick(g, c, a, R - 20, R - 8, 1.5, inRed ? 'rgba(255,59,47,.5)' : far ? '#343d47' : '#4a5460');
    }
    for (var w = 0; w <= o.max + 1e-6; w += o.label) {
      var b = ang(w / o.max), p = pt(c, b, R - 64), red = o.red && w >= o.red;
      el('text', { x: p[0], y: p[1] + 1 + 0.4 * 28, 'text-anchor': 'middle',
        style: 'font-size:28px;fill:' + (red ? 'rgba(255,59,47,.85)' : o.quiet && w > o.quiet ? '#69737e' : '#9aa5b1') }, g, o.fmt(w));
    }
  }
  var P = JSON.parse(document.getElementById('theme-params').textContent);
  dial(document.getElementById('dialS'), SPD, { max: P.maxMph, major: 20, minor: 5, label: 20, fmt: String });
  dial(document.getElementById('dialT'), TAC, { max: P.maxRpm, major: 1000, minor: 250, label: 1000, red: P.redRpm, quiet: P.quietRpm,
    fmt: function (v) { return String(v / 1000); } });
  el('text', { x: TAC[0], y: TAC[1] - R + 96, 'text-anchor': 'middle', style: 'font-size:17px;letter-spacing:2px;fill:#7a8592' },
    document.getElementById('dialT'), '× 1000');
  ['speedArc', 'cruiseArc'].forEach(function (id) { document.getElementById(id).setAttribute('d', arcD(SPD, R, A0, A0 + SWEEP)); });
  document.getElementById('tachArc').setAttribute('d', arcD(TAC, R, A0, A0 + SWEEP));

  /* the design's view of what the layers draw (hidden in the art) */
  [['fuelBar', 24, 221, 576, 239, 10, 11, '#d9e6f2', 6.96], ['hvBar', 24, 659, 673, 320, 8, 17, '#3f9cff', 10.33]].forEach(function (b) {
    var g = document.getElementById(b[0]), cw = b[4] / b[1];
    for (var j = 0; j < b[1]; j++) el('rect', { x: b[2] + j * cw + (cw - b[8]) / 2, y: b[3], width: b[8], height: b[5], rx: 1, style: 'fill:' + (j < b[6] ? b[7] : '#18202a') }, g);
  });
})();
</script>
</body>
</html>
