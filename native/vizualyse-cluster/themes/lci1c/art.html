<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later

     lci1c "LCI inspired 1 · Comfort": the static art of the LCI Comfort mockup
     (its SVG, geometry and colours), without what moves. Bands, tints,
     traces, needles, the drive meter, bars, the cruise mark and every reading
     are the theme's layers (theme.src.json, written by gen.js). A value tspan
     kept here with fill-opacity 0 only holds its unit where the mockup puts
     it; gen.js reads those positions with #measure. Scale numerals are drawn
     dim: the numerals layer brightens the ones the band has reached. Both
     turn arrows are drawn; the layers mask the one not taken. The map area
     stays an empty panel. -->
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; font-style: normal; font-weight: 100 900; font-stretch: 62% 125%; src: url(../lci1/fonts/Archivo.woff2) format("woff2"); }
html, body { margin: 0; background: #000; }
svg { display: block; }
text { font-family: "Archivo", sans-serif; fill: #f5f8ff; font-variant-numeric: tabular-nums lining-nums; }
.big   { font-size: 112px; font-weight: 600; font-stretch: 108%; letter-spacing: -0.02em; }
.val   { font-size: 44px; font-weight: 600; font-stretch: 108%; }
.val-s { font-size: 24px; font-weight: 600; font-stretch: 108%; }
.unit  { font-size: 18px; font-weight: 500; fill: #b4c8ff; }
.lab   { font-size: 18px; font-weight: 600; letter-spacing: 0.08em; fill: #b4c8ff; }
.zone  { font-size: 14px; font-weight: 600; letter-spacing: 0.1em; fill: #7f8fb8; }
.sub   { font-size: 22px; font-weight: 500; fill: #b4c8ff; }
.scale { font-size: 30px; font-weight: 500; font-stretch: 108%; fill: #7f8fb8; }
.corner { font-size: 20px; font-weight: 500; fill: #7f8fb8; }
.clock  { font-size: 32px; font-weight: 500; font-stretch: 108%; }
.sign  { font-size: 34px; font-weight: 700; font-stretch: 100%; fill: #0a0d18; }
.hid { fill-opacity: 0; }
.ico path { fill: none; stroke: #b4c8ff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.arrow { fill: none; stroke: #f5f8ff; stroke-width: 6; stroke-linejoin: miter; stroke-linecap: butt; }
#out { position: absolute; left: 0; top: 0; color: #fff; font: 10px monospace; white-space: pre; }
</style>
<svg id="stage" width="1920" height="646" viewBox="0 0 1920 646" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="hexclip"><polygon points="430,30 1490,30 1668,320 1490,610 430,610 252,320"/></clipPath>
    <linearGradient id="fieldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1340d2"/><stop offset=".5" stop-color="#0d33bd"/><stop offset="1" stop-color="#071b72"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="646" fill="#020308"/>

  <!-- hexagonal field -->
  <polygon points="430,30 1490,30 1668,320 1490,610 430,610 252,320" fill="url(#fieldg)"/>
  <g clip-path="url(#hexclip)">
    <path d="M430,610 L252,320 L430,30" transform="translate(54 0)" fill="none" stroke="#2c5cf0" stroke-opacity=".4" stroke-width="34" stroke-linejoin="miter"/>
    <path d="M1490,610 L1668,320 L1490,30" transform="translate(-54 0)" fill="none" stroke="#2c5cf0" stroke-opacity=".4" stroke-width="34" stroke-linejoin="miter"/>
    <path d="M430,610 L252,320 L430,30" transform="translate(11 0)" fill="none" stroke="#0c4560" stroke-width="18"/>
    <path d="M1490,610 L1668,320 L1490,30" transform="translate(-11 0)" fill="none" stroke="#16286e" stroke-width="18"/>
    <path d="M1490,610 L1668,320 L1490,30" pathLength="1000" transform="translate(-11 0)" fill="none" stroke="#ff2a45" stroke-opacity=".5" stroke-width="18" stroke-dasharray="0 929 71 0"/>
    <path d="M1490,610 L1668,320 L1490,30" pathLength="1000" transform="translate(-11 0)" fill="none" stroke="#020308" stroke-width="18" stroke-dasharray="0 927 3 70"/>
    <path d="M430,610 L252,320 L430,30" transform="translate(31 0)" fill="none" stroke="#5b86ff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M1490,610 L1668,320 L1490,30" transform="translate(-31 0)" fill="none" stroke="#5b86ff" stroke-opacity=".55" stroke-width="2"/>
  </g>

  <g id="scaleL"></g>
  <g id="scaleR"></g>

  <!-- inner panel -->
  <polygon points="746,66 1174,66 1330,320 1174,574 746,574 590,320" fill="#040a28" stroke="#5b86ff" stroke-opacity=".6" stroke-width="1.5"/>

  <!-- economy readings and the charge / eco / power meter -->
  <text class="lab" x="940" y="106" text-anchor="end">AVERAGE</text>
  <text x="940" y="156" text-anchor="end"><tspan id="mAvg" class="val hid">52.3</tspan><tspan class="unit" dx="6">mpg</tspan></text>
  <text class="lab" x="980" y="106">ON ELECTRIC</text>
  <text x="980" y="156"><tspan id="mEv" class="val hid">6.2</tspan><tspan class="unit hid" dx="6">mi</tspan></text>
  <rect x="730" y="172" width="106" height="8" fill="#12235e"/>
  <rect x="844" y="172" width="232" height="8" fill="#12235e"/>
  <rect x="1084" y="172" width="106" height="8" fill="#12235e"/>
  <rect x="839" y="164" width="2" height="24" fill="#b4c8ff"/>
  <rect x="1079" y="168" width="2" height="16" fill="#7f8fb8"/>
  <text class="zone" x="783" y="208" text-anchor="middle">CHARGE</text>
  <text class="zone" x="960" y="208" text-anchor="middle">ECO</text>
  <text class="zone" x="1137" y="208" text-anchor="middle">POWER</text>

  <!-- the map area: the car draws its own map here, the theme only frames it -->
  <polygon points="662,238 1258,238 1308,320 1190,512 730,512 612,320" fill="#0a1a5c" stroke="#5b86ff" stroke-opacity=".6" stroke-width="1.5"/>
  <text class="zone" x="960" y="372" text-anchor="middle" style="fill:#7f96e0">MAP AREA</text>
  <text class="unit" x="960" y="398" text-anchor="middle" style="fill:#7f96e0">drawn by the car</text>

  <!-- upper left wing: speed limit and cruise -->
  <circle cx="506" cy="138" r="37" fill="#f5f8ff"/>
  <circle cx="506" cy="138" r="32.5" fill="none" stroke="#ff2a45" stroke-width="9"/>
  <text class="lab" x="566" y="112">CRUISE</text>
  <text x="566" y="160"><tspan id="mCruise" class="val hid">70</tspan><tspan class="unit hid" dx="6">mph</tspan></text>

  <!-- upper right wing: the next turn, both arrows (the layers mask one) -->
  <g transform="translate(1388 100)">
    <path class="arrow" d="M20,64 V30 H46"/><path d="M42,16 L60,30 L42,44 Z" fill="#f5f8ff"/>
    <path class="arrow" d="M20,64 V30 H-6"/><path d="M-2,16 L-20,30 L-2,44 Z" fill="#f5f8ff"/>
  </g>

  <!-- speed and gear boxes -->
  <polygon points="338,320 378,254 586,254 600,268 600,386 378,386" fill="#00030a" stroke="#b4c8ff" stroke-opacity=".4"/>
  <text class="unit" x="584" y="377" text-anchor="end" style="font-size:18px">mph</text>
  <polygon points="1582,320 1542,254 1334,254 1320,268 1320,386 1542,386" fill="#00030a" stroke="#b4c8ff" stroke-opacity=".4"/>
  <text x="1368" y="352"><tspan id="mD" class="big">D</tspan><tspan id="mGear" class="val hid" style="font-size:52px" dx="10">5</tspan></text>

  <!-- lower wings -->
  <g id="bars"></g>
  <g id="iFuel" class="ico"><path d="M4,22 V5 a2,2 0 0 1 2,-2 h7 a2,2 0 0 1 2,2 V22 M2,22 H17 M6.5,7 h6 v5 h-6 z M15,11 h1.5 a2,2 0 0 1 2,2 v5 a1.75,1.75 0 0 0 3.5,0 V9 l-3,-3"/></g><text id="wFuel"><tspan id="mFuel" class="val-s hid">286</tspan><tspan class="unit" dx="4">mi</tspan></text><text class="sub hid" id="sFuel">58 %</text>
  <g id="iBat" class="ico"><path d="M2,8 h20 v12 h-20 z M6,8 V5 h4 v3 M14,8 V5 h4 v3 M5.5,14 h5 M13.5,14 h5 M16,11.5 v5"/></g><text id="wBat"><tspan id="mBat" class="val-s hid">21</tspan><tspan class="unit" dx="4">mi</tspan></text><text class="sub hid" id="sBat">64 %</text>
  <g id="iCool" class="ico"><path d="M12,2 v11.5 M12,5 h4.5 M12,9 h4.5 M9,16.5 a3,3 0 1 0 6,0 a3,3 0 1 0 -6,0 M1.5,20.5 q2.75,-2.5 5.5,0 M17,20.5 q2.75,-2.5 5.5,0"/></g><text id="wCool" text-anchor="end"><tspan id="mCool" class="val-s hid">90</tspan><tspan class="unit" dx="4">°C</tspan></text>
  <g id="iMpg" class="ico"><path d="M12,2.5 q7.5,9.5 7.5,13 a7.5,7.5 0 0 1 -15,0 q0,-3.5 7.5,-13 z M8.5,16 a3.5,3.5 0 0 0 3.5,3.5"/></g><text id="wMpg" text-anchor="end"><tspan id="mMpg" class="val-s hid">56</tspan><tspan id="mMpgUnit" class="unit" dx="4">mpg</tspan></text><text class="sub" id="sMpg" text-anchor="end">now</text>

  <!-- corners -->
  <text class="corner" x="64" y="58">mph</text>
  <text class="corner" x="1856" y="58" text-anchor="end">1/min × 1000</text>
  <text class="corner" x="64" y="552"><tspan id="mTripW">Trip </tspan><tspan id="mTrip" class="hid">18.4 mi</tspan></text>
  <text class="corner" x="1856" y="552" text-anchor="end">Tyres <tspan id="mT0" class="hid">36</tspan> · <tspan id="mT1" class="hid">36</tspan> · <tspan id="mT2" class="hid">38</tspan> · <tspan id="mT3" class="hid">38</tspan> psi</text>
  <text class="clock" x="1856" y="596" text-anchor="end" style="letter-spacing:.06em">COMFORT</text>
  <text class="corner" x="1856" y="624" text-anchor="end"><tspan id="mOdo" class="hid">24 816</tspan> mi</text>
</svg>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e); return e;
  }
  /* the mockup's own builders, unchanged in geometry */
  var K = 178 / 290, NX = 0.8523, NY = 0.5231;
  function edgePt(f, side) {
    var y = 610 - f * 580, dx = 178 - Math.abs(y - 320) * K;
    return { x: side < 0 ? 430 - dx : 1490 + dx, y: y, upper: f > 0.5 };
  }
  var numerals = [];
  function buildScale(g, side, majors, minors, toF) {
    minors.concat(majors).forEach(function (v, i) {
      var major = i >= minors.length;
      if (!major && majors.indexOf(v) >= 0) return;
      var p = edgePt(toF(v), side), f = toF(v);
      var nx = side * NX, ny = f === 0.5 ? 0 : (p.upper ? -NY : NY);
      if (f === 0.5) nx = side;
      var a = 5, b = major ? 20 : 12;
      el('line', { x1: p.x + nx * a, y1: p.y + ny * a, x2: p.x + nx * b, y2: p.y + ny * b,
        stroke: major ? '#b4c8ff' : '#56648c', 'stroke-width': major ? 2.5 : 1.5 }, g);
      if (major) {
        var t = el('text', { 'class': 'scale', x: p.x + side * 34, y: p.y + 10, 'text-anchor': side < 0 ? 'end' : 'start' }, g);
        t.textContent = v >= 1000 ? v / 1000 : v;
        numerals.push({ side: side, v: v, t: t, y: p.y + 10 });
      }
    });
  }
  var i, mM = [], mm = [], rM = [], rm = [];
  for (i = 0; i <= 180; i += 20) mM.push(i);
  for (i = 0; i <= 180; i += 10) mm.push(i);
  for (i = 0; i <= 7000; i += 1000) rM.push(i);
  for (i = 0; i <= 7000; i += 500) rm.push(i);
  buildScale($('scaleL'), -1, mM, mm, function (v) { return v / 180; });
  buildScale($('scaleR'), 1, rM, rm, function (v) { return v / 7000; });

  var Y0 = 590, Y1 = 424;
  function barX(y, side, off) {
    var edge = side < 0 ? 252 + (y - 320) * K : 1668 - (y - 320) * K;
    return edge + (side < 0 ? off : -off - 10);
  }
  function barPts(side, off, ya, yb) {
    var xa = barX(ya, side, off), xb = barX(yb, side, off);
    return xa + ',' + ya + ' ' + (xa + 10) + ',' + ya + ' ' + (xb + 10) + ',' + yb + ' ' + xb + ',' + yb;
  }
  function makeBar(side, off, track, warnFrom, warnCol) {
    var g = $('bars');
    el('polygon', { points: barPts(side, off, Y0, Y1), fill: track }, g);
    if (warnFrom != null) {
      var yw = Y0 - warnFrom * (Y0 - Y1);
      el('polygon', { points: warnFrom > 0.5 ? barPts(side, off, yw, Y1) : barPts(side, off, Y0, yw), fill: warnCol, opacity: 0.45 }, g);
    }
  }
  makeBar(-1, 92, '#0a1d6a', 0.12, '#ffb224');
  makeBar(-1, 216, '#0a1d6a', null);
  makeBar(1, 92, '#0a1d6a', 0.82, '#ff2a45');
  makeBar(1, 216, '#0a1d6a', null);
  function place(id, side, off, y) {
    var x = barX(y, side, off) + (side < 0 ? 26 : -16);
    $(id).setAttribute('x', x); $(id).setAttribute('y', y);
  }
  function icon(id, side, off) {
    var x = barX(440, side, off) + (side < 0 ? 26 : -16 - 24);
    $(id).setAttribute('transform', 'translate(' + x.toFixed(1) + ' 430)');
  }
  icon('iFuel', -1, 92); place('wFuel', -1, 92, 490); place('sFuel', -1, 92, 518);
  icon('iBat', -1, 216); place('wBat', -1, 216, 490); place('sBat', -1, 216, 518);
  icon('iCool', 1, 92); place('wCool', 1, 92, 490);
  icon('iMpg', 1, 216); place('wMpg', 1, 216, 490); place('sMpg', 1, 216, 518);

  /* #measure: where the mockup puts each reading, for gen.js */
  if (location.hash !== '#measure') return;
  document.fonts.ready.then(function () {
    var out = { spans: {}, numerals: [] };
    ['mAvg', 'mEv', 'mCruise', 'mD', 'mGear', 'mFuel', 'mBat', 'mCool', 'mMpg', 'mMpgUnit', 'sFuel', 'sBat', 'mTripW', 'mTrip', 'mT0', 'mT1', 'mT2', 'mT3', 'mOdo'].forEach(function (id) {
      var e = $(id), n = e.textContent.length;
      var a = e.getStartPositionOfChar(0), b = e.getEndPositionOfChar(n - 1), bb = e.getBBox();
      out.spans[id] = { x0: a.x, x1: b.x, y: a.y, bx: bb.x, bw: bb.width, by: bb.y, bh: bb.height };
    });
    numerals.forEach(function (n) {
      var b = n.t.getBBox();
      out.numerals.push({ side: n.side, v: n.v, x: b.x, w: b.width, y: n.y });
    });
    var pre = document.createElement('div'); pre.id = 'out';
    pre.textContent = 'MEASURE' + JSON.stringify(out) + 'END';
    document.body.appendChild(pre);
  });
})();
</script>
