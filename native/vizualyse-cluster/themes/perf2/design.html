<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later
     Copyright (C) 2026 Yousaf Khan
     perf2 "Performance 2": the Performance Sport mockup as a design
     (DESIGNS.md), fitted to the car's panel (DESIGNS.md "The car's panel"):
     the top row (clock, shift lights, SPORT) up at the top edge; the dials
     larger (R 276, round), pulled in clear of the warning lights on the left
     and the parking brake light; fuel and range in the speedometer's open
     bottom, oil and coolant right of the gear window; the centre column's
     power, chassis (car plan and friction circle, x1.2) and high-voltage
     battery above the bottom-left lights, the 12 V battery in the strip
     beside them.
     Build: node tools/design_build.js themes/perf2 -->
<html>
<head>
<meta charset="utf-8">
<meta name="theme-id" content="perf2">
<meta name="theme-title" content="Performance 2">
<meta name="theme-family" content="perf2">
<meta name="theme-mode" content="sport">
<meta name="theme-ship" content="true">
<meta name="theme-bottom" content="720">
<meta name="safe-top" content="8">

<!-- shared values: the smoothed needles, the shift cue and its flash (0.17 s a phase, as the mockup) -->
<meta name="let:vMph" content="smooth(mph(kmh), 14)">
<meta name="let:vRpm" content="smooth(rpm, 22)">
<meta name="let:cue" content="rpm >= P.shiftRpm && !(throttle <= 0.5) && !(gear >= P.topGear)">
<meta name="let:fl" content="flash(2.94, cue)">
<script type="application/json" id="theme-params">
{ "maxMph": 180, "maxRpm": 8000, "redRpm": 7000, "shiftRpm": 6400, "lampFrom": 4600,
  "amberRpm": 5275, "redStageRpm": 5950, "topGear": 8, "fuelLowPct": 15,
  "tyreCold": 70, "tyreHot": 95, "gK": 96, "dialLen": 1300.62,
  "bars": { "len": 695, "pMin": -100, "pMax": 500, "pT1": 0.74820, "bMin": -1, "bMax": 2, "bT0": 0.78417, "bT1": 1 },
  "oil": { "lo": 50, "hi": 150, "w": 150 }, "cool": { "lo": 50, "hi": 130, "w": 150 } }
</script>

<style>
@font-face { font-family: "Cluster"; font-weight: 500; src: url(../fonts/BarlowSemiCondensed-500.woff2) format("woff2"); }
@font-face { font-family: "Cluster"; font-weight: 600; src: url(../fonts/BarlowSemiCondensed-600.woff2) format("woff2"); }
@font-face { font-family: "Cluster"; font-weight: 700; src: url(BarlowSemiCondensed-700.woff2) format("woff2"); }
:root {
  --ground: #04060a; --ink: #eef2f6; --ink-2: #9ba6b2; --ink-3: #7a8592; --well: #0d1218;
  --red: #ff3b2f; --red-deep: #b8180f; --amber: #ffb224; --blue: #3f9cff; --cool: #d9e6f2;
  --track: #18202a; --track-dim: #121820; --flash-off: #2a0d0b; --glow: #121417; --glow-red: #290805;
  --hair: rgba(196,214,232,.10);
}
html, body { margin: 0; width: 1920px; height: 720px; overflow: hidden; background: #000; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 720px;
  background:
    radial-gradient(460px 425px at 442px 380px, #0b1118 0%, rgba(11,17,24,0) 70%),
    radial-gradient(460px 425px at 1478px 380px, #0b1118 0%, rgba(11,17,24,0) 70%),
    radial-gradient(640px 500px at 960px 400px, #080c12 0%, rgba(8,12,18,0) 75%),
    var(--ground); }
svg { position: absolute; left: 0; top: 0; display: block; }
svg text { font-family: "Cluster", sans-serif; font-weight: 600; fill: var(--ink); font-variant-numeric: tabular-nums; }
.lbl { font-size: 18px; letter-spacing: 2.52px; fill: var(--ink-2); }
.unit { font-weight: 500; fill: var(--ink-2); }
.v40 { font-size: 40px; } .v30 { font-size: 30px; } .v22 { font-size: 22px; }
.status { font-size: 16px; font-weight: 700; letter-spacing: 2.24px; fill: var(--blue); }
.hr { fill: var(--hair); }
.seg { fill: var(--track); }
</style>
</head>
<body>
<div id="stage"></div>
<svg id="cluster" width="1920" height="720" viewBox="0 0 1920 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#3a6" stroke-width="3"/>
    </pattern>
  </defs>
  <rect data-guide x="0" y="0" width="1920" height="8" fill="url(#hatch)" opacity="0.5"/>

  <!-- the dials' static parts (bezel, well, scale, numerals, red zone, shift notch): drawn by the script -->
  <g id="dialS"></g>
  <g id="dialT"></g>

  <!-- the speed trail, its glow and the red needle. The trail dims before half the
       swept part and the glow trails all of it (logic.extra.js); passed ticks and
       numerals brighten (look). data-pool only widens the field (the cruise notch in Comfort). -->
  <path id="speedArc" fill="none" stroke="var(--cool)" stroke-width="12" data-gauge="speed"
        data-value="vMph / P.maxMph"
        data-band="-6 6" data-band-color="alpha(C.cool, 0.25)" data-red="0.5" data-red-color="alpha(C.cool, 0.8)"
        data-needle="-12 46 6 2.4" data-needle-color="C.red"
        data-glow="92 600 0.8" data-glow-color="C.glow" data-pool="40 0 0" data-look="0.25 2 1"/>
  <!-- the rev trail: frost, amber from the lamps' amber stage; all red, flashing, at the shift cue -->
  <path id="tachArc" fill="none" stroke="var(--cool)" stroke-width="12" data-gauge="tach" data-reuse="speed"
        data-value="vRpm / P.maxRpm"
        data-band="-6 6" data-band-color="when(cue, alpha(C.red, when(fl, 1, 0.25)), alpha(C.cool, 0.45))"
        data-red="0.659375" data-red-color="when(cue, alpha(C.red, when(fl, 1, 0.25)), C.amber)"
        data-needle="-12 46 6 2.4" data-needle-color="when(cue, C.red, rgb(0, 0, 0, 0))"
        data-glow="92 600 0.8" data-glow-color="when(cue, alpha(C.glowRed, when(fl, 1, 0.3)), C.glow)"
        data-pool="40 0 0" data-look="0.25 2 1"/>
  <!-- over it: the red stage of the trail and the needle; at the cue, the bezel lit (logic.extra.js) -->
  <path id="tachRedArc" fill="none" stroke="var(--red)" stroke-width="12" data-gauge="tachRed" data-reuse="speed" data-art="off"
        data-value="vRpm / P.maxRpm"
        data-band="-6 6" data-band-color="rgb(0, 0, 0, 0)" data-red="0.74375" data-red-color="C.red"
        data-needle="-12 46 6 2.4" data-needle-color="C.red"/>

  <!-- top row: clock and outside temperature, the shift lights, SPORT and the shift point -->
  <text x="702" y="49" text-anchor="end" style="font-size:30px" data-text="topText" data-glyphs="−" data-rate="10"
        data-text-expr="when(/^\d{1,2}:\d\d$/.test(clock), clock, '--:--') + '    ' + when(round(outsideC) &lt; 0, '−', '') + fmt(abs(round(outsideC)))">18:05    −12</text>
  <text class="unit" x="709.6" y="49" style="font-size:30px">°C</text>
  <g id="lights" data-leds="shift" data-count="15" data-mode="ends" data-light="20 20" data-split="3 6" data-radius="3" data-halo="12"
     data-c0="C.cool" data-c1="C.amber" data-c2="C.red" data-off="when(cue, C.flashOff, C.trackDim)"
     data-lit="when(cue, 8, when(ok(vRpm), floor(clamp((vRpm - P.lampFrom) / (P.shiftRpm - P.lampFrom) * 8, 0, 8) + 0.0001), 0))"
     data-flash="when(cue, when(fl, 1, 2), 0)">
    <rect x="750" y="16" width="420" height="40" fill="none"/>
  </g>
  <text x="1204" y="47" style="font-size:26px;font-weight:700;letter-spacing:5.2px">SPORT</text>
  <text id="shiftPoint" x="1324" y="47" style="font-size:23px"><tspan class="unit" style="font-weight:600">Shift </tspan><tspan id="shiftN">6,400</tspan></text>

  <!-- speedometer centre -->
  <text x="442" y="420" text-anchor="middle" style="font-size:156px;letter-spacing:-3.1px" data-text="speedText"
        data-text-expr="fmt(mph(kmh))">188</text>
  <text class="unit" x="442" y="466" text-anchor="middle" style="font-size:26px">mph</text>

  <!-- fuel and range in the speedometer's open bottom -->
  <text class="lbl" x="442" y="600" text-anchor="middle">FUEL</text>
  <g id="fuelBar" data-leds="fuel" data-count="24" data-light="8.17 11" data-radius="1"
     data-c0="when(fuelPct &lt; P.fuelLowPct, C.amber, C.cool)" data-off="C.track"
     data-lit="when(ok(fuelPct), round(fuelPct / 100 * 24), 0)" data-rate="10">
    <rect x="302" y="613" width="280" height="11" fill="none"/>
  </g>
  <text x="303" y="645" style="font-size:16px;fill:var(--ink-3)">E</text>
  <text x="442" y="645" text-anchor="middle" style="font-size:16px;fill:var(--ink-3)">½</text>
  <text x="581" y="645" text-anchor="end" style="font-size:16px;fill:var(--ink-3)">F</text>
  <text x="422" y="703" text-anchor="end" style="font-size:44px" data-text="rangeText" data-rate="10"
        data-text-expr="fmt(miles(rangeKm)).replace(/\B(?=(\d{3})+(?!\d))/g, ',')">999</text>
  <text class="unit" x="429" y="703" style="font-size:22px">miles range</text>

  <!-- tachometer centre: the cue (a sprite, below), the gear, the revs -->
  <text x="1478" y="444" text-anchor="middle" style="font-size:176px" data-text="gearText" data-glyphs="MDSPRN" data-dy="0"
        data-text-expr="when(/^[PRN]$/.test(gearMode), gearMode, when(!ok(gear), '--', when(gear === 0, 'N', when(/^[MDS]$/.test(gearMode), gearMode, '') + fmt(gear))))"
        data-color="when(cue, C.red, C.ink)">M8</text>
  <text x="1497" y="500" text-anchor="end" style="font-size:34px" data-text="rpmText"
        data-text-expr="fmt(round(vRpm, 10)).replace(/\B(?=(\d{3})+(?!\d))/g, ',')">8,000</text>
  <text class="unit" x="1503" y="500" style="font-size:20px">rpm</text>

  <!-- oil and coolant at the bottom right, clear of the gear window -->
  <text class="lbl" x="1500" y="616">OIL</text>
  <text class="lbl" x="1712" y="616">COOLANT</text>
  <text x="1565" y="661" text-anchor="end" style="font-size:44px" data-text="oilText" data-text-expr="fmt(oilC)" data-rate="10">150</text>
  <text class="unit" x="1569" y="661" style="font-size:22px">°C</text>
  <text x="1777" y="661" text-anchor="end" style="font-size:44px" data-text="coolText" data-text-expr="fmt(coolantC)" data-rate="10">130</text>
  <text class="unit" x="1781" y="661" style="font-size:22px">°C</text>
  <rect x="1500" y="678" width="150" height="6" rx="1" class="seg"/>
  <rect x="1560" y="678" width="45" height="6" style="fill:rgba(196,214,232,.22)"/>
  <rect x="1712" y="678" width="150" height="6" rx="1" class="seg"/>
  <rect x="1768.25" y="678" width="46.88" height="6" style="fill:rgba(196,214,232,.22)"/>
  <rect x="1498.5" y="674" width="3" height="14" rx="1" style="fill:var(--ink)" data-rect="oilMark" data-rate="10"
        data-dx="clamp((oilC - P.oil.lo) / (P.oil.hi - P.oil.lo)) * P.oil.w"/>
  <rect x="1710.5" y="674" width="3" height="14" rx="1" style="fill:var(--ink)" data-rect="coolMark" data-rate="10"
        data-dx="clamp((coolantC - P.cool.lo) / (P.cool.hi - P.cool.lo)) * P.cool.w"/>

  <!-- centre column: system power and boost -->
  <text class="lbl" x="700" y="106">SYSTEM POWER</text>
  <text x="800" y="168" text-anchor="end" style="font-size:66px" data-text="powerText" data-glyphs="−" data-text-expr="'--'">−100</text>
  <text class="unit" x="808" y="168" style="font-size:26px">hp</text>
  <text class="lbl" x="1220" y="106" text-anchor="end" style="letter-spacing:2.52px">BOOST</text>
  <text x="1184" y="152" text-anchor="end" style="font-size:44px" data-text="boostText" data-glyphs="−" data-text-expr="'--'" data-rate="10">−0.65</text>
  <text class="unit" x="1190" y="152" style="font-size:20px">bar</text>
  <rect x="1070" y="166" width="150" height="6" rx="1" class="seg"/>
  <rect x="1119" y="162" width="2" height="14" style="fill:var(--ink-3)"/>
  <rect x="700" y="188" width="520" height="12" rx="1" style="fill:var(--track-dim)"/>
  <rect x="785.7" y="182" width="2" height="24" style="fill:var(--ink)"/>
  <!-- one path for both bars: the power bar left to right, up, the boost bar right to left
       (both fills are set by logic.extra.js: engine, electric after it, regen hatched left of zero; boost from zero) -->
  <path id="barsPath" d="M700 194 L1220 194 L1220 169 L1070 169" fill="none" stroke="var(--cool)" stroke-width="12"
        data-gauge="power" data-end="175" data-value="0" data-band="-6 6" data-red-color="C.blue"/>
  <path d="M700 194 L1220 194 L1220 169 L1070 169" fill="none" stroke="var(--cool)" stroke-width="6"
        data-gauge="boost" data-reuse="power" data-art="off" data-start="545" data-value="0" data-band="-3 3"/>
  <text class="lbl" x="710" y="234">ENGINE</text>
  <text x="826" y="234" text-anchor="end" style="font-size:24px" data-text="engText" data-text-expr="'--'" data-rate="10">500</text>
  <text class="unit" x="830" y="234" style="font-size:16px">hp</text>
  <text class="lbl" x="1048" y="234">ELECTRIC</text>
  <text x="1188" y="234" text-anchor="end" style="font-size:24px;fill:var(--blue)" data-text="eleText" data-glyphs="+−" data-text-expr="'--'" data-rate="10">+109</text>
  <text class="unit" x="1192" y="234" style="font-size:16px">hp</text>
  <rect class="hr" x="700" y="252" width="520" height="1"/>

  <!-- chassis: the car plan in its friction circle (x1.2 of the mockup's), tyres by temperature, the g dot -->
  <g id="car" transform="translate(828 289) scale(1.2)">
    <circle cx="110" cy="110" r="100" fill="none" stroke="rgba(196,214,232,.16)" stroke-width="1"/>
    <circle cx="110" cy="110" r="50" fill="none" stroke="rgba(196,214,232,.10)" stroke-width="1" stroke-dasharray="2 4"/>
    <path d="M6 110h22M192 110h22M110 6v22M110 192v22" stroke="rgba(196,214,232,.22)" stroke-width="1"/>
    <g transform="translate(70 18)">
      <rect x="-2.25" y="30.75" width="10.5" height="30.5" rx="3" fill="#04060a" stroke="#9ba6b2" stroke-width="1.5"/>
      <rect x="71.75" y="30.75" width="10.5" height="30.5" rx="3" fill="#04060a" stroke="#9ba6b2" stroke-width="1.5"/>
      <rect x="-2.25" y="122.75" width="10.5" height="30.5" rx="3" fill="#04060a" stroke="#9ba6b2" stroke-width="1.5"/>
      <rect x="71.75" y="122.75" width="10.5" height="30.5" rx="3" fill="#04060a" stroke="#9ba6b2" stroke-width="1.5"/>
      <path d="M40 2C25 2 13 5 9 13 6 19 5 26 5 30v4c-2 2-2 4-2 7v22c0 3 0 5 2 7v46c-2 2-2 4-2 7v24c0 3 0 5 2 7v6c0 9 3 14 10 16 7 3 16 4 25 4s18-1 25-4c7-2 10-7 10-16v-6c2-2 2-4 2-7v-24c0-3 0-5-2-7V70c2-2 2-4 2-7V41c0-3 0-5-2-7v-4c0-4-1-11-4-17C67 5 55 2 40 2Z" fill="rgba(11,16,23,.5)" stroke="rgba(196,214,232,.2)" stroke-width="1.25"/>
      <path d="M3 50l-5-3M77 50l5-3" stroke="rgba(196,214,232,.2)" stroke-width="2" stroke-linecap="round"/>
      <path d="M14 58c12-6 40-6 52 0l-5 20c-12-3-30-3-42 0Z" fill="rgba(196,214,232,.04)" stroke="rgba(196,214,232,.14)" stroke-width="1"/>
      <path d="M19 80c11-2 31-2 42 0v42c-11 2-31 2-42 0Z" fill="none" stroke="rgba(196,214,232,.08)" stroke-width="1"/>
      <path d="M19 124c11 3 31 3 42 0l4 18c-14 4-36 4-50 0Z" fill="rgba(196,214,232,.03)" stroke="rgba(196,214,232,.12)" stroke-width="1"/>
      <path d="M16 14c8-4 40-4 48 0" fill="none" stroke="rgba(196,214,232,.16)" stroke-width="1"/>
      <!-- the warm tyres: two lights a pair, each its tyre's colour (cold: none, the hollow wheel shows) -->
      <g data-leds="wheelsF" data-count="2" data-light="14.4 38.4" data-split="1 2" data-radius="3.6" data-off="rgb(0, 0, 0, 0)" data-lit="2" data-rate="10"
         data-c0="step(round(tyres[0].c), rgb(0, 0, 0, 0), P.tyreCold, C.cool, P.tyreHot + 1, C.amber)"
         data-c1="step(round(tyres[1].c), rgb(0, 0, 0, 0), P.tyreCold, C.cool, P.tyreHot + 1, C.amber)">
        <rect x="-34" y="30" width="148" height="32" fill="none"/>
      </g>
      <g data-leds="wheelsR" data-count="2" data-light="14.4 38.4" data-split="1 2" data-radius="3.6" data-off="rgb(0, 0, 0, 0)" data-lit="2" data-rate="10"
         data-c0="step(round(tyres[2].c), rgb(0, 0, 0, 0), P.tyreCold, C.cool, P.tyreHot + 1, C.amber)"
         data-c1="step(round(tyres[3].c), rgb(0, 0, 0, 0), P.tyreCold, C.cool, P.tyreHot + 1, C.amber)">
        <rect x="-34" y="122" width="148" height="32" fill="none"/>
      </g>
    </g>
    <circle cx="110" cy="110" r="2.5" fill="rgba(238,242,246,.5)"/>
  </g>
  <circle cx="960" cy="421" r="8" style="fill:var(--ink);stroke:var(--ground);stroke-width:2.5" data-rect="gDot"
          data-dx="smooth(clamp(gLat, -1.25, 1.25) * P.gK, 10)" data-dy="smooth(clamp(-gLon, -1.25, 1.25) * P.gK, 10)"/>
  <text x="950" y="578" text-anchor="end" style="font-size:20px;fill:var(--ink-2)">G</text>
  <text x="955" y="578" style="font-size:24px" data-text="gText" data-text-expr="fmt(Math.hypot(gLat, gLon), 2)" data-rate="10">1.25</text>

  <!-- tyres: pressure, and temperature coloured cold / warm / hot -->
  <text class="v30" x="803" y="367" text-anchor="end" data-text="psiFL" data-text-expr="fmt(psi(tyres[0].bar), 1)" data-rate="10">39.9</text>
  <text class="unit" x="808" y="367" style="font-size:17px">psi</text>
  <text style="font-size:24px" x="810" y="394.6" text-anchor="end" data-text="tempFL" data-text-expr="fmt(tyres[0].c)" data-rate="10"
        data-color="step(round(tyres[0].c), C.ink2, P.tyreCold, C.ink, P.tyreHot + 1, C.amber)">110</text>
  <text class="unit" x="814" y="394.6" style="font-size:16px">°C</text>
  <text class="v30" x="803" y="494" text-anchor="end" data-text="psiRL" data-text-expr="fmt(psi(tyres[2].bar), 1)" data-rate="10">39.9</text>
  <text class="unit" x="808" y="494" style="font-size:17px">psi</text>
  <text style="font-size:24px" x="810" y="521.6" text-anchor="end" data-text="tempRL" data-text-expr="fmt(tyres[2].c)" data-rate="10"
        data-color="step(round(tyres[2].c), C.ink2, P.tyreCold, C.ink, P.tyreHot + 1, C.amber)">110</text>
  <text class="unit" x="814" y="521.6" style="font-size:16px">°C</text>
  <text class="v30" x="1092" y="367" data-text="psiFR" data-text-expr="fmt(psi(tyres[1].bar), 1)" data-rate="10">39.9</text>
  <text class="unit" x="1150" y="367" style="font-size:17px">psi</text>
  <text style="font-size:24px" x="1092" y="394.6" data-text="tempFR" data-text-expr="fmt(tyres[1].c)" data-rate="10"
        data-color="step(round(tyres[1].c), C.ink2, P.tyreCold, C.ink, P.tyreHot + 1, C.amber)">110</text>
  <text class="unit" x="1118" y="394.6" style="font-size:16px">°C</text>
  <text class="v30" x="1092" y="494" data-text="psiRR" data-text-expr="fmt(psi(tyres[3].bar), 1)" data-rate="10">39.9</text>
  <text class="unit" x="1150" y="494" style="font-size:17px">psi</text>
  <text style="font-size:24px" x="1092" y="521.6" data-text="tempRR" data-text-expr="fmt(tyres[3].c)" data-rate="10"
        data-color="step(round(tyres[3].c), C.ink2, P.tyreCold, C.ink, P.tyreHot + 1, C.amber)">110</text>
  <text class="unit" x="1118" y="521.6" style="font-size:16px">°C</text>
  <rect class="hr" x="700" y="592" width="520" height="1"/>

  <!-- the high-voltage battery above the bottom-left warning lights (kept clear: y 660 down, x 560-900) -->
  <text class="lbl" x="700" y="619">HIGH-VOLTAGE BATTERY</text>
  <text class="status" x="1220" y="619" text-anchor="end" data-text="hvState" data-rate="10"
        data-text-expr="when(!ok(elecHp), '--', when(elecHp &lt; -0.5, 'REGEN', when(elecHp > 20, 'DEPLOY', 'HOLD')))">DEPLOY</text>
  <text x="764" y="655" text-anchor="end" style="font-size:44px" data-text="hvText" data-text-expr="fmt(socPct)" data-rate="10">100</text>
  <text class="unit" x="768" y="655" style="font-size:22px">%</text>
  <g id="hvBar" data-leds="hv" data-count="24" data-light="12 9" data-radius="1" data-c0="C.blue" data-off="C.track"
     data-lit="when(ok(socPct), round(socPct / 100 * 24), 0)" data-rate="10">
    <rect x="808" y="636" width="412" height="9" fill="none"/>
  </g>

  <!-- the 12 V battery in the strip, between the bottom-left lights and the gear window -->
  <text class="lbl" x="934" y="703">12 V BATTERY</text>
  <text x="1104" y="705" style="font-size:34px" data-text="voltsText" data-text-expr="fmt(volts12, 1)" data-rate="10">14.4</text>
  <text class="unit" x="1170" y="705" style="font-size:22px">V</text>
  <text class="status" x="1310" y="703" text-anchor="end" style="fill:var(--ink-2)" data-text="lvNote" data-rate="10"
        data-text-expr="when(volts12 >= 13.5, 'CHARGING', '')">CHARGING</text>

  <!-- the shift cue above the gear: shown at the shift point -->
  <g id="cue" data-sprite="cue" data-show="cue">
    <path d="M1424.6 268.5 1436.6 256.5l12 12" fill="none" stroke="var(--red)" stroke-width="4.5" stroke-linecap="square"/>
    <text x="1459.6" y="271.5" style="font-size:20px;font-weight:700;letter-spacing:4px;fill:var(--red)">SHIFT</text>
  </g>
</svg>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent, text) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    parent.appendChild(n);
    return n;
  }
  var R = 276, A0 = 135, SWEEP = 270, D = Math.PI / 180;
  var SPD = [442, 380], TAC = [1478, 380];
  function ang(f) { return A0 + SWEEP * Math.min(1, Math.max(0, f)); }
  function pt(c, a, r) { return [c[0] + Math.cos(a * D) * r, c[1] + Math.sin(a * D) * r]; }
  function arcD(c, r, a1, a2) {
    var p = pt(c, a1, r), q = pt(c, a2, r);
    return 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'A' + r + ' ' + r + ' 0 ' + (a2 - a1 > 180 ? 1 : 0) + ' 1 ' + q[0].toFixed(2) + ' ' + q[1].toFixed(2);
  }
  function arc(g, c, r, a1, a2, w, col) { el('path', { d: arcD(c, r, a1, a2), fill: 'none', stroke: col, 'stroke-width': w }, g); }
  function tick(g, c, a, r1, r2, w, col) {
    var p = pt(c, a, r1), q = pt(c, a, r2);
    el('line', { x1: p[0], y1: p[1], x2: q[0], y2: q[1], stroke: col, 'stroke-width': w, 'stroke-linecap': 'butt' }, g);
  }
  /* the mockup's drawDial + drawScale (dim) + drawNumerals (dim): the gauge layers brighten what the needle passed */
  function dial(g, c, o) {
    arc(g, c, R + 18, A0, A0 + SWEEP, 1.25, 'rgba(196,214,232,.16)');
    arc(g, c, R, A0, A0 + SWEEP, 12, '#0d1218');
    arc(g, c, R - 96, A0, A0 + SWEEP, 1, 'rgba(196,214,232,.06)');
    if (o.red) {
      arc(g, c, R, ang(o.red / o.max), ang(1), 12, 'rgba(184,24,15,.55)');
      arc(g, c, R + 18, ang(o.red / o.max), ang(1), 3, '#ff3b2f');
    }
    for (var v = 0; v <= o.max + 1e-6; v += o.minor) {
      var a = ang(v / o.max), major = Math.abs(v / o.major - Math.round(v / o.major)) < 1e-6, inRed = o.red && v >= o.red;
      if (major) tick(g, c, a, R - 34, R - 8, 3, inRed ? '#ff3b2f' : '#8f9aa6');
      else tick(g, c, a, R - 20, R - 8, 1.5, inRed ? 'rgba(255,59,47,.7)' : '#4a5460');
    }
    for (var w = 0; w <= o.max + 1e-6; w += o.label) {
      var b = ang(w / o.max), p = pt(c, b, R - 64), red = o.red && w >= o.red;
      /* canvas textBaseline middle: the alphabetic baseline 0.4 em below the middle */
      el('text', { x: p[0], y: p[1] + 1 + 0.4 * 30, 'text-anchor': 'middle', style: 'font-size:30px;fill:' + (red ? '#ff3b2f' : '#9aa5b1') }, g, o.fmt(w));
    }
    if (o.shift) {
      var s = ang(o.shift / o.max), p0 = pt(c, s, R + 22), p1 = pt(c, s - 1.26, R + 38), p2 = pt(c, s + 1.26, R + 38);
      el('path', { d: 'M' + p0 + 'L' + p1 + 'L' + p2 + 'Z', fill: '#ff3b2f' }, g);
    }
  }
  var P = JSON.parse(document.getElementById('theme-params').textContent);
  dial(document.getElementById('dialS'), SPD, { max: P.maxMph, major: 20, minor: 5, label: 20, fmt: String });
  dial(document.getElementById('dialT'), TAC, { max: P.maxRpm, major: 1000, minor: 250, label: 1000, red: P.redRpm, shift: P.shiftRpm,
    fmt: function (v) { return String(v / 1000); } });
  el('text', { x: TAC[0], y: TAC[1] - R + 96, 'text-anchor': 'middle', style: 'font-size:17px;letter-spacing:2px;fill:#7a8592' },
    document.getElementById('dialT'), '× 1000');
  document.getElementById('shiftN').textContent = P.shiftRpm.toLocaleString('en-GB');
  /* the gauges' paths: the whole 270 degree sweep, clockwise from the bottom left */
  document.getElementById('speedArc').setAttribute('d', arcD(SPD, R, A0, A0 + SWEEP));
  document.getElementById('tachArc').setAttribute('d', arcD(TAC, R, A0, A0 + SWEEP));
  document.getElementById('tachRedArc').setAttribute('d', arcD(TAC, R, A0, A0 + SWEEP));

  /* the design's view of what the layers draw (hidden in the art) */
  var lights = document.getElementById('lights');
  for (var i = 0; i < 15; i++) {
    var ring = Math.min(i, 14 - i);
    el('rect', { x: 754 + i * 28, y: 26, width: 20, height: 20, rx: 3, style: 'fill:' + (ring < 3 ? '#d9e6f2' : ring < 5 ? '#ffb224' : '#121820') }, lights);
  }
  [['fuelBar', 24, 302, 613, 280, 11, 11, '#d9e6f2'], ['hvBar', 24, 808, 636, 412, 9, 17, '#3f9cff']].forEach(function (b) {
    var g = document.getElementById(b[0]), cw = b[4] / b[1], lw = b[0] === 'fuelBar' ? 8.17 : 12;
    for (var j = 0; j < b[1]; j++) el('rect', { x: b[2] + j * cw + (cw - lw) / 2, y: b[3], width: lw, height: b[5], rx: 1, style: 'fill:' + (j < b[6] ? b[7] : '#18202a') }, g);
  });
})();
</script>
</body>
</html>
