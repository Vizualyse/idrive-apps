<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Cast to iDrive</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --text:#e6edf3; --dim:#8b949e; --accent:#2f81f7; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 -apple-system, system-ui, sans-serif;
         padding:max(16px, env(safe-area-inset-top)) 16px 32px; }
  h1 { font-size:22px; margin:4px 0 2px; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.t { display:block; font-size:13px; color:var(--dim); margin:0 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  input[type=url] { width:100%; font-size:16px; padding:12px; border-radius:10px; border:1px solid var(--line);
                    background:var(--bg); color:var(--text); }
  .seg { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg button { padding:12px 8px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:15px; }
  .seg button.on { border-color:var(--accent); background:rgba(47,129,247,.15); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; }
  input[type=range] { width:60%; accent-color:var(--accent); }
  input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
  .go { display:grid; grid-template-columns:2fr 1fr; gap:10px; }
  .go button { padding:15px; border:0; border-radius:12px; font-size:17px; font-weight:600; color:#fff; }
  #play { background:var(--accent); } #stop { background:#30363d; }
  button:disabled { opacity:.5; }
  .st { display:flex; align-items:center; gap:10px; font-weight:600; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.playing { background:var(--ok); } .dot.error { background:var(--bad); }
  .meta { color:var(--dim); font-size:14px; margin-top:6px; word-break:break-all; }
  .err { color:var(--bad); font-size:14px; margin-top:6px; word-break:break-word; }
  .small { color:var(--dim); font-size:13px; }
  a { color:var(--accent); }
  .seg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; }
  .seg3 button { padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-size:14px; }
  .seg3 button.on { border-color:var(--accent); background:rgba(47,129,247,.15); }
  .pv { position:relative; margin-top:12px; border-radius:10px; overflow:hidden; background:#000; aspect-ratio:1920/720; }
  .pv img { width:100%; height:100%; display:block; object-fit:fill; }
  .pv canvas { position:absolute; inset:0; width:100%; height:100%; }
  .hide { display:none !important; }
  .link { background:none; border:0; color:var(--accent); font-size:14px; padding:6px 0; }
</style>
</head>
<body>
<h1>Cast to iDrive</h1>
<div class="sub" id="sub">Connecting…</div>

<div class="card" id="srcCard">
  <label class="t">Source</label>
  <div class="seg" id="sources">
    <button data-src="url">Stream URL</button>
    <button data-src="screen">Central screen</button>
  </div>
</div>

<div class="card hide" id="screenCard">
  <label class="t">What goes to the cluster</label>
  <div class="seg3" id="crops"></div>
  <div class="pv" id="pv"><img id="shot" alt=""><canvas id="box"></canvas></div>
  <button class="link" id="refresh">Refresh preview</button>
  <div class="small">The preview is the central screen now; the outlines are what is sent. Open CarPlay (Google Maps) on the central screen first.</div>
</div>

<div class="card" id="urlCard">
  <label class="t" for="url">Stream URL</label>
  <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
         placeholder="https://… (file, HLS .m3u8, rtsp://…)">
</div>

<div class="card">
  <label class="t">Video output</label>
  <div class="seg" id="outputs"></div>
  <div class="row" id="audioRow"><span>Sound through the speakers</span><input id="audio" type="checkbox" checked></div>
  <div class="row" id="volRow"><span>Volume <span id="volv">60</span>%</span><input id="vol" type="range" min="0" max="150" value="60"></div>
</div>

<div class="go">
  <button id="play">Play</button>
  <button id="stop">Stop</button>
</div>

<div class="card" style="margin-top:14px">
  <div class="st"><span class="dot" id="dot"></span><span id="state">—</span></div>
  <div class="meta" id="meta"></div>
  <div class="err" id="err"></div>
</div>

<div class="row small">
  <span>QR code on the cluster while idle</span><input id="qr" type="checkbox" checked>
</div>

<script>
(function () {
  var token = new URLSearchParams(location.search).get('t') || '';
  var $ = function (id) { return document.getElementById(id); };
  var output = 'map', built = false, source = 'url', crop = 'carplay', crops = [], screenSize = { W: 1920, H: 720 }, lastOutputs = [];

  function get(k, d) { try { return localStorage.getItem('cast.' + k) || d; } catch (e) { return d; } }
  function put(k, v) { try { localStorage.setItem('cast.' + k, v); } catch (e) {} }

  $('url').value = get('url', '');
  output = get('output', 'map');
  source = get('source', 'url');
  crop = get('crop', 'carplay');
  $('vol').value = get('volume', '60'); $('volv').textContent = $('vol').value;
  $('audio').checked = get('audio', '1') === '1';

  function api(p, body) {
    return fetch(p, { method: body ? 'POST' : 'GET', headers: { 'X-Cast-Token': token, 'Content-Type': 'application/json' },
                      body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); });
  }

  function buildOutputs(list) {
    var box = $('outputs'); box.innerHTML = '';
    if (source === 'screen') list = list.filter(function (o) { return o.id === 'map' || o.id === 'hud'; });
    if (!list.some(function (o) { return o.id === output; }) && list.length) { output = list[0].id; }
    list.forEach(function (o) {
      var b = document.createElement('button'); b.textContent = o.title; b.dataset.id = o.id;
      b.onclick = function () { output = o.id; put('output', o.id); mark(); };
      box.appendChild(b);
    });
    built = true; mark();
  }
  function mark() { Array.prototype.forEach.call($('outputs').children, function (b) { b.classList.toggle('on', b.dataset.id === output); }); }

  function setSource(src) {
    source = src; put('source', src);
    Array.prototype.forEach.call($('sources').children, function (b) { b.classList.toggle('on', b.dataset.src === src); });
    $('urlCard').classList.toggle('hide', src === 'screen');
    $('screenCard').classList.toggle('hide', src !== 'screen');
    $('audioRow').classList.toggle('hide', src === 'screen');
    $('volRow').classList.toggle('hide', src === 'screen');
    buildOutputs(lastOutputs);
    if (src === 'screen' && !$('shot').src) refreshShot();
  }
  Array.prototype.forEach.call($('sources').children, function (b) { b.onclick = function () { setSource(b.dataset.src); }; });

  function buildCrops(list) {
    crops = list; var box = $('crops'); box.innerHTML = '';
    list.forEach(function (c) {
      var b = document.createElement('button'); b.textContent = c.title.replace(' (stacked)', ''); b.dataset.id = c.id;
      b.onclick = function () { crop = c.id; put('crop', c.id); markCrop(); drawBoxes(); };
      box.appendChild(b);
    });
    markCrop(); drawBoxes();
  }
  function markCrop() { Array.prototype.forEach.call($('crops').children, function (b) { b.classList.toggle('on', b.dataset.id === crop); }); }
  function drawBoxes() {
    var cv = $('box'), r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    var g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height);
    var c = crops.filter(function (x) { return x.id === crop; })[0]; if (!c) return;
    var kx = cv.width / screenSize.W, ky = cv.height / screenSize.H;
    (c.stack || [c]).forEach(function (q, i) {
      g.fillStyle = 'rgba(47,129,247,.18)'; g.strokeStyle = '#2f81f7'; g.lineWidth = 2 * dpr;
      g.fillRect(q.x * kx, q.y * ky, q.w * kx, q.h * ky); g.strokeRect(q.x * kx, q.y * ky, q.w * kx, q.h * ky);
      if (c.stack) { g.fillStyle = '#fff'; g.font = (12 * dpr) + 'px sans-serif'; g.fillText(String(i + 1), q.x * kx + 5 * dpr, q.y * ky + 15 * dpr); }
    });
  }
  function refreshShot() {
    $('refresh').textContent = 'Taking a snapshot…';
    var img = $('shot');
    img.onload = function () { $('refresh').textContent = 'Refresh preview'; drawBoxes(); };
    img.onerror = function () { $('refresh').textContent = 'No preview (refresh)'; };
    img.src = '/api/screen.jpg?t=' + encodeURIComponent(token) + '&n=' + Date.now();
  }
  $('refresh').onclick = refreshShot;
  window.addEventListener('resize', drawBoxes);

  function show(s) {
    if (s.outputs) lastOutputs = s.outputs;
    if (s.outputs && !$('outputs').children.length) buildOutputs(s.outputs);
    if (s.screenSize) screenSize = s.screenSize;
    if (s.crops && !crops.length) buildCrops(s.crops);
    $('srcCard').classList.toggle('hide', !s.screen);
    $('sub').textContent = 'Uplink ' + s.uplink + ' · renderer ' + s.render;
    $('dot').className = 'dot ' + s.state;
    var names = {}; (s.outputs || []).forEach(function (o) { names[o.id] = o.title; });
    $('state').textContent = { playing: 'Playing', idle: 'Idle', ended: 'Ended', error: 'Error' }[s.state] || s.state;
    var m = [];
    if (s.url) m.push(s.url);
    if (s.output) m.push(names[s.output] + (s.state === 'playing' ? (s.audio ? ', sound ' + s.volume + '%' : ', no sound') : ''));
    if (s.state === 'playing') m.push(s.frames + ' frames · ' + s.seconds + ' s');
    $('meta').textContent = m.join(' · ');
    $('err').textContent = s.error || '';
    $('qr').checked = !!s.qr;
  }

  function poll() { api('/api/status').then(show).catch(function (e) { $('sub').textContent = 'Not reachable: ' + e.message; }); }

  $('vol').oninput = function () { $('volv').textContent = this.value; put('volume', this.value); };
  $('audio').onchange = function () { put('audio', this.checked ? '1' : '0'); };
  $('qr').onchange = function () { api('/api/qr', { show: this.checked }).then(show); };
  $('play').onclick = function () {
    var body;
    if (source === 'screen') {
      body = { source: 'screen', crop: crop, output: output };
    } else {
      var url = $('url').value.trim(); if (!url) { $('url').focus(); return; }
      put('url', url);
      body = { url: url, output: output, audio: $('audio').checked, volume: Number($('vol').value) };
    }
    $('play').disabled = true; $('err').textContent = '';
    api('/api/play', body)
      .then(show).catch(function (e) { $('err').textContent = e.message; })
      .then(function () { $('play').disabled = false; });
  };
  $('stop').onclick = function () { api('/api/stop', {}).then(show); };

  setSource(source);
  poll(); setInterval(poll, 1500);
})();
</script>
</body>
</html>
