#
# vizualyse-bus: the tools' shared bus (platform tool/mqtt_bus). One
# listener, a Unix socket in /run/vizualyse-bus, which systemd makes 0700
# root's (RuntimeDirectory): only root's tools reach it, never a game, the
# browser's renderer or anything on the network (there is no TCP listener,
# and the service has no network of its own: PrivateNetwork).
per_listener_settings false
listener 0 /run/vizualyse-bus/mqtt.sock
allow_anonymous true

# root, without any capability (the unit's CapabilityBoundingSet): the unit
# may have no "mosquitto" user to drop to, and the socket's folder is root's
user root

# Retained asks live in memory only: a restart of the broker loses them and
# every tool sends its own again when it connects (mqtt_bus.js).
persistence false
autosave_interval 0
max_packet_size 65536
max_queued_messages 100
retain_available true
sys_interval 0

log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp false
