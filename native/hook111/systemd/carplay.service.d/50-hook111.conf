# hook111: carplay reads /run/hook111/env when it starts, if it exists.
# hook111-arm.service writes it (LD_PRELOAD: the stock libschedconfig, then
# libhook111.so) only for a start it arms. /run is tmpfs, so every reboot, a
# crash reboot included, starts carplay stock until the arm step decides again.
# Values from the file override the unit's Environment=.
[Service]
EnvironmentFile=-/run/hook111/env
