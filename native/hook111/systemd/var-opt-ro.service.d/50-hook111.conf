# hook111: before /var/opt goes read-only (at a shutdown, or the fast shutdown
# a carplay crash causes), record whether carplay was running, stopped or had
# failed. Bounded to 3 s, and it never fails, so it never holds up the remount.
[Service]
ExecStartPre=-/bin/sh /var/opt/hook111/current/hook111-arm.sh mark
