# Publishes new versions of the components to this repository's GitHub
# Releases, with the catalog.json the Store reads (release/README.md). Push a
# v* tag, or run it by hand with the component ids to publish (empty: all).
#
# Each component builds in a job of its own, all at once (release.js build
# <id>); the publish job then uploads what they built (publish --from). A
# component that does not build is left out and fails the run, as before;
# the others are published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      components:
        description: Component ids to publish, space-separated (empty publishes every component)
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # the builds' finished parts by their inputs' keys (tools/build_cache.sh):
  # Steam's Mesa builds, ntdll and bundle, ~12 min when rebuilt. main's
  # own caches only (a branch's are not visible here).
  BUILD_CACHE: /tmp/build-cache

# Actions are pinned to commits: each runs in a workflow that holds the
# contents: write token.
jobs:
  # the components to build, as the matrix's list (an unknown id fails here)
  plan:
    # main and v* tags only: work-in-progress branches do not publish
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - id: ids
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          node -e '
            const all = require("./release/release.js").components().map((c) => c.id);
            const want = (process.env.COMPONENTS || "").split(/\s+/).filter(Boolean);
            const bad = want.filter((id) => all.indexOf(id) < 0);
            if (bad.length) {
                console.error(`no component ${bad.join(", ")} (have: ${all.join(", ")})`);
                process.exit(1);
            }
            console.log(`ids=${JSON.stringify(want.length ? want : all)}`);' >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build ${{ matrix.id }}
    runs-on: ubuntu-24.04
    strategy:
      # a component that does not build leaves the others to publish
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.plan.outputs.ids) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SOURCE_DATE_EPOCH comes from each component's last commit
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      # vizualyse-chromium's build image from the cache (built once per Dockerfile)
      - name: Chromium build image
        if: matrix.id == 'vizualyse-chromium'
        uses: ./.github/actions/chromium-image

      # the builds' pinned source downloads (Mosquitto) from the cache
      - name: Pinned downloads
        if: matrix.id == 'vizualyse-bus' || matrix.id == 'vizualyse-steam'
        uses: ./.github/actions/mgu-dl

      # the newest saved build cache (Steam's parts); the build takes what still matches
      - name: Build cache (restore)
        if: matrix.id == 'vizualyse-steam'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/build-cache
          key: build-cache-${{ github.run_id }}
          restore-keys: build-cache-

      # the tools' builds run make target: Docker, preinstalled on the runner
      - name: Build
        env:
          ID: ${{ matrix.id }}
        run: node release/release.js build "$ID"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-${{ matrix.id }}
          path: release/out/*.tgz
          if-no-files-found: error
          retention-days: 3

      # saved only when a part was built (build_cache_put leaves .changed)
      - name: Build cache (anything new?)
        id: build-cache
        if: always() && matrix.id == 'vizualyse-steam'
        run: |
          if [ -f /tmp/build-cache/.changed ]; then
            rm -f /tmp/build-cache/.changed
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build cache (save)
        if: always() && steps.build-cache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/build-cache
          key: build-cache-${{ github.run_id }}

  publish:
    needs: [plan, build]
    # after a failed build too: the others publish, release.js names the missing one
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the published catalog's commit must be an ancestor of HEAD
          fetch-depth: 0
          # publishing talks to the API through GH_TOKEN, not git
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: built-*
          path: ${{ runner.temp }}/built
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
          MGU_PUBLISH_VISIBILITY: any
          COMPONENTS: ${{ inputs.components }}
        run: node release/release.js publish --from="$RUNNER_TEMP/built" $COMPONENTS

      - name: Published catalog
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MGU_PUBLISH: github:${{ github.repository }}
        run: node release/release.js list
