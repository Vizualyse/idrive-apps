# Tests on every push to main and every pull request: the platform (its
# pins, its frozen versions, the audio player), the Cast page against
# a fake HMI and the tool's real control socket, the Moonlight page against
# a fake HMI and a fake tool socket, the Moonlight tool end to end against
# a real Sunshine (pairing, a stream, a virtual gamepad), the release
# tooling, every shipped script parsing on Node 8 (the head unit's), and
# two clean builds of each component compared byte for byte.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      # first: every later step reads the components' platform copies
      - name: Platform (pins, copies, frozen versions; every component's copies)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node platform/platform.js check ${BASE:+--base "$BASE"}
          node platform/platform.js sync
          node platform/test/platform_test.js
      - name: Platform audio player (mgu-python's Python, as root)
        run: |
          for t in platform/tool/pcm_play/*/test/pcm_play_test.py; do
            docker run --rm -v "$PWD:/r:ro" -w /r python:3.12-slim python3 "$t" || exit 1
          done
      - name: Platform speakers (CarLife's source for a tool's sound; the unit's Node 8)
        run: |
          for t in platform/tool/speakers/*/test/speakers_test.js; do
            docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node "$t" || exit 1
          done
      - name: Cast page
        run: node apps/vizualyse_cast/tools/test_page.js
      - name: Moonlight page
        run: node apps/vizualyse_moonlight/tools/test_page.js
      - name: Browser page
        run: node apps/vizualyse_chromium/tools/test_page.js
      - name: Steam page
        run: node apps/vizualyse_steam/tools/test_page.js
      - name: Steam's perf lines (fps, lows, FSR's GPU time; the unit's Node 8)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node native/vizualyse-steam/test/perf_test.js
      - name: Steam's taps (the button a frame after the pointer, held 150 ms or three frames; Node 8)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node native/vizualyse-steam/test/tap_test.js
      - name: Steam's swap file on the hard disk (made once, on during a game; BusyBox, Node 8)
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine node native/vizualyse-steam/test/swap_test.js
      - name: Steam's Detail (engines, launch options, dxvk.conf, WINE_D3D_CONFIG)
        run: node native/vizualyse-steam/test/detail_test.js
      - name: Release tooling
        run: node release/test/release_test.js
      - name: Node 8 syntax (the head unit's)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine sh -c '
            for f in native/vizualyse-cast/src/*.js native/vizualyse-cast/test/bus_test.js platform/tool/mqtt_bus/*/*.js platform/tool/mqtt_bus/*/test/*.js apps/vizualyse_cast/src/*.js apps/vizualyse_moonlight/src/*.js native/vizualyse-moonlight/src/*.js apps/vizualyse_chromium/src/*.js native/vizualyse-chromium/src/*.js native/vizualyse-chromium/test/*.js apps/vizualyse_steam/src/*.js native/vizualyse-steam/src/*.js native/vizualyse-steam/test/*.js samples/*/*.js; do node -c "$f" || exit 1; done'
      - name: CarPlay second screen source (Node 8, the kit's ffmpeg)
        run: |
          node native/vizualyse-cast/tools/fetch_ffmpeg.js
          docker run --rm -v "$PWD/native:/n:ro" -w /n/vizualyse-cast node:8.16.2-alpine node test/carplay_test.js
      - name: Control sockets open to their own app only (both tools, as root, glibc Node 8)
        run: |
          docker build -q -t ml-unit:18.04-node8 native/vizualyse-moonlight/test/unit
          docker run --rm -v "$PWD:/repo:ro" -w /repo ml-unit:18.04-node8 sh -c '
            node native/vizualyse-cast/test/control_test.js &&
            node native/vizualyse-cast/test/control_test.js native/vizualyse-moonlight/src/control.js vizualyse_moonlight &&
            node native/vizualyse-cast/test/control_test.js native/vizualyse-chromium/src/control.js vizualyse_chromium &&
            node native/vizualyse-cast/test/control_test.js native/vizualyse-steam/src/control.js vizualyse_steam'
      - name: Pinned downloads (cached)
        uses: ./.github/actions/mgu-dl
      - name: The tools' bus (Mosquitto built for the unit, the client and Cast on glibc Node 8, as root)
        run: BUS_TEST_IMAGE=ml-unit:18.04-node8 sh native/vizualyse-bus/test/run_test.sh
      - name: Moonlight against Sunshine (the head unit in a box, Node 8)
        timeout-minutes: 20
        run: |
          sudo modprobe uinput || true
          sudo modprobe vhci-hcd || true
          sh native/vizualyse-moonlight/build.sh
          sh native/vizualyse-moonlight/test/run_sunshine_test.sh
      - name: Chromium build image (cached)
        uses: ./.github/actions/chromium-image
      - name: Browser bundle (Chromium for the unit; the sink's colour test)
        timeout-minutes: 30
        run: sh native/vizualyse-chromium/build.sh
      - name: Steam bundles (Proton, the runtime, the prefix made by Proton)
        timeout-minutes: 30
        run: sh native/vizualyse-steam/build.sh
      - name: Reproducible builds
        run: node release/release.js check
