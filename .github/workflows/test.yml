# Tests on every push to main and every pull request: the Cast page against
# a fake HMI and the tool's real control socket, the release tooling, every
# shipped script parsing on Node 8 (the head unit's), and two clean builds
# of each component compared byte for byte.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Cast page
        run: node apps/vizualyse_cast/tools/test_page.js
      - name: Release tooling
        run: node release/test/release_test.js
      - name: Node 8 syntax (the head unit's)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo node:8.16.2-alpine sh -c '
            for f in native/vizualyse-cast/src/*.js apps/vizualyse_cast/src/*.js samples/*/*.js; do node -c "$f" || exit 1; done'
      - name: CarPlay second screen source (Node 8, the kit's ffmpeg)
        run: |
          node native/vizualyse-cast/tools/fetch_ffmpeg.js
          docker run --rm -v "$PWD/native/vizualyse-cast:/t:ro" -w /t node:8.16.2-alpine node test/carplay_test.js
      - name: Reproducible builds
        run: node release/release.js check
